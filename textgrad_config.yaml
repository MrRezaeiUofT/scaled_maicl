# TextGrad Configuration
# This file contains all prompts and templates used by the TextGrad optimizer

prompts:
  optimization:
    main_template: |
      You are optimizing a SCIENTIFIC MECHANISM that needs improvement.
      
      {dataset_context}

      CURRENT MECHANISM:

      {mechanism}

      {error_feedback}

      {iteration_history}

      {feature_instruction}

      YOUR TASK: Create an improved mechanism based on the insights above.
      
      CRITICAL INSTRUCTIONS:
      - If "LATENT MECHANISM INSIGHTS" is provided, USE IT as your primary guide - it contains pre-computed analysis identifying error patterns, missing interactions, nonlinearities, and suggested intermediate concepts
      - If iteration history is provided, learn from what worked/didn't work in previous iterations
      - If performance is poor (low R²/high MAE), CREATE A NEW MECHANISM structure, not just adjust coefficients
      - Prioritize common patterns across multiple batches in latent insights (high priority)
      - Incorporate suggested intermediate concepts (latent variables) from the insights
      - Use the missing interactions and nonlinearities identified in the insights

      QUALITY REQUIREMENTS:

      ✓ Use actual feature names (not x1, x2, etc.)
      ✓ Directly address the specific error patterns shown in the residual analysis
      ✓ Keep mechanism interpretable (3-5 key terms)
      ✓ Each term must have clear mechanistic meaning
      ✓ {formula_instruction}
      ✓ If data is scaled: ALL constants in your formula must be in the scaled range (e.g., [0,1]). Base constants on the scaled sample values you see, not raw physical units.

      OUTPUT FORMAT:

      DIAGNOSIS:

      [5-10 sentences: What is causing the errors? Reference specific patterns from LATENT MECHANISM INSIGHTS if provided.]

      FIX:

      [5-10 sentences: What new mechanism will fix this? Reference how you're incorporating insights from LATENT MECHANISM INSIGHTS and iteration history.]

      REVISED MECHANISM:

      [5-10 sentences: Describe the mechanism and how it addresses the insights. Explicitly reference intermediate concepts and interactions from LATENT MECHANISM INSIGHTS if provided.]

      Formula: ŷ = [executable expression with ACTUAL feature names - create a NEW mechanism, don't just adjust old coefficients]
      {formula_instruction}

      Now provide YOUR new optimized mechanism:

  update_mechanism:
    template: |
      Update this mechanism by incorporating the improvement suggestions:

      Original mechanism:
      {mechanism}

      Improvement suggestions:
      {gradient}

      {update_instruction}

      Updated mechanism (2-3 concise sentences):

  update_instructions:
    classification: "Update the mechanism to improve Accuracy and F1 score (primary metrics) by refining feature interactions, thresholds, and decision boundaries. Do NOT use feature importance values as coefficients - learn proper coefficients (0.1-2.0 range) by optimizing Accuracy and F1. Preserve correctness on easy cases and focus on systematic residual patterns."
    regression: "Update the mechanism to maximize R² and minimize MAE (primary metrics) by refining monotonic trends, curvature, and interaction terms. Do NOT use feature importance values as coefficients - learn proper coefficients (0.1-2.0 range) by optimizing R² and MAE. Explicitly address residual bias and outliers while keeping predictions in the correct scaled range."

templates:
  feature_instruction:
    deepchem: |
      
      CRITICAL: This is a molecular dataset (DeepChem). Use SMILES strings, NOT ECFP bit features.
      
      Use molecular properties: molecular_weight, num_rings, num_hydroxyl_groups, num_halogen, num_nitrogen, num_oxygen
      
      Example: base + (num_hydroxyl_groups * 0.3) - (num_halogen * 0.15) - (molecular_weight * 0.001)
      
    standard: |
      
      CRITICAL: Use actual feature names (not x1, x2, etc.): {feature_list}
      
      Example: Instead of "x1 + x2", write "{feature_example}"

  dataset_contexts:
    # -----------------------------
    # Reusable templates (anchors)
    # -----------------------------
    tabular_classification: &tabular_classification |
      DATASET: {dataset_name}
      DOMAIN: Tabular Classification
      TASK: Predict a discrete class label from input features.
      FEATURES: {features}

    tabular_regression: &tabular_regression |
      DATASET: {dataset_name}
      DOMAIN: Tabular Regression
      TASK: Predict a continuous target from input features.
      {scale_info}
      FEATURES: {features}

    molecular_classification: &molecular_classification |
      DATASET: {dataset_name}
      DOMAIN: Molecular Classification (SMILES)
      TASK: Predict class label from molecular structure.
      GUIDANCE:
      - Use molecular properties derived from SMILES (molecular_weight, num_rings, num_halogen, num_hydroxyl_groups, num_nitrogen, num_oxygen).
      - Do NOT use ECFP bit features.
      FEATURES: SMILES + derived properties

    molecular_regression: &molecular_regression |
      DATASET: {dataset_name}
      DOMAIN: Molecular Regression (SMILES)
      TASK: Predict a continuous molecular property from molecular structure.
      Use molecular properties (NOT ECFP bits): molecular_weight, num_rings, num_halogen, num_hydroxyl_groups, num_nitrogen, num_oxygen
      {scale_info}
      FEATURES: SMILES + derived properties

    enzyme_regression: &enzyme_regression |
      DATASET: {dataset_name}
      DOMAIN: Enzyme Activity Regression
      TASK: Predict enzyme activity/affinity from sequence/substrate-derived features.
      Common mechanisms: Michaelis-Menten saturation, cofactor dependencies, temperature optima, competitive inhibition
      {scale_info}
      FEATURES: {features}

    enzyme_classification: &enzyme_classification |
      DATASET: {dataset_name}
      DOMAIN: Enzyme Activity Classification
      TASK: Predict a discrete class from sequence/substrate-derived features.
      GUIDANCE:
      - Use class scores + thresholds/argmax.
      FEATURES: {features}

    enzyme: |
      DATASET: Enzyme Activity Prediction
      DOMAIN: Biochemistry / Biocatalysis
      Key mechanisms: Michaelis-Menten saturation, cofactor dependencies, temperature optima, competitive inhibition
      FEATURES: {features}
    protein: |
      DATASET: Protein Expression Yield
      DOMAIN: Molecular Biology / Synthetic Biology
      Key mechanisms: Saturation effects (NAD/ATP), cofactor dependencies, resource allocation
      FEATURES: {features}
    # Regression biotech datasets (018)
    protein_expression: *tabular_regression
    protein_expression_all: *tabular_regression
    dataset_102: *tabular_regression
    gfp_yield: |
      DATASET: GFP Yield Prediction (Cell-Free Expression)
      DOMAIN: Synthetic Biology / Cell-Free Protein Expression
      TASK: Predict GFP production yield from experimental conditions
      Key mechanisms: Temperature (Gaussian), Mg/K/NTPs/DNA (Michaelis-Menten saturation), interactions
      {scale_info}
      FEATURES: {features}

    # Cell-free batch CSVs (018): exact keys = lowercase dataset label + "_" + task (see textgrad.TextGrad._get_dataset_context)
    gfp (cell-free yield)_regression: |
      DATASET: {dataset_name}
      DOMAIN: Cell-free protein synthesis — **GFP reporter** (NiCo21(DE3) lysate; CSV batch under MohammadFiles/April).
      TASK: Predict **Yield** from reaction design: temperature, K+, Mg2+, NTPs, TCEP (reducing), DNA template.
      PROTEIN-SPECIFIC CONTEXT (do not generalize to other constructs):
      - GFP maturation needs folding plus chromophore oxidation; mechanisms should allow **nonlinear temperature** (optimum / cold stall / heat stress) and **redox–folding coupling** (TCEP vs disulfide needs).
      - Treat **Mg2+ × K+** as ribosome/translation stability; **NTP × DNA** as transcription–translation resource coupling; watch for saturation and competition at high DNA.
      OPTIMIZATION: Residuals often reflect missed **T×Mg**, **NTP saturation**, or **DNA-limited vs DNA-toxic** regimes—prefer interpretable biochemistry over generic polynomials.
      {scale_info}
      FEATURES: {features}

    griffithsin (cell-free yield)_regression: |
      DATASET: {dataset_name}
      DOMAIN: Cell-free synthesis — **Griffithsin** lectin (engineered *E. coli* K12 Shuffle lysate).
      TASK: Predict **Yield** from the same reaction-condition columns as other batch CSVs, but mechanisms must reflect **Griffithsin biology**:
      - Dimeric antiviral lectin (~12.7 kDa monomer): **dimer assembly**, high solubility at moderate ionic strength, and **mannose-binding surface** chemistry can change how Mg2+/K+ and crowding affect solubility vs. a small barrel reporter.
      - Ionic strength and reducing environment (TCEP) may dominate **aggregation vs. functional dimer** tradeoffs.
      OPTIMIZATION: If errors cluster at extreme K/Mg or high DNA, model **solubility / assembly** not only transcription capacity.
      {scale_info}
      FEATURES: {features}

    npm2e (cell-free yield)_regression: |
      DATASET: {dataset_name}
      DOMAIN: Cell-free synthesis — **NPM2e** (nucleophosmin-family; Shuffle K12 lysate).
      TASK: Predict **Yield** from reaction conditions; emphasize **intrinsically disordered / acidic hub** behavior:
      - Strong coupling to **NTP pools** and **Mg2+** (translation + RNA binding); phase-separation-like sensitivity can make yield sharply depend on **ionic composition** and template load (DNA).
      - Crowding from high DNA or salt can help or hurt solubility—residuals may need **non-monotone** ion terms, not a single “more is better” trend.
      OPTIMIZATION: Prefer mechanisms that separate **translation flux** from **soluble functional fraction** of NPM2e.
      {scale_info}
      FEATURES: {features}

    scfvlr (cell-free yield)_regression: |
      DATASET: {dataset_name}
      DOMAIN: Cell-free synthesis — **scFvLR** single-chain Fv (Shuffle K12 lysate).
      TASK: Predict **Yield**; scFv folding is not GFP-like:
      - **VH–VL interface** and linker strain; **disulfide** formation vs. reduction (TCEP) can dominate—explicitly consider redox-dependent folding pathways.
      - Mg2+/elongation and chaperone-like extract effects may show as **interaction with TCEP**, not just additive ions.
      OPTIMIZATION: Systematic under/overprediction vs. TCEP or Mg often means the mechanism should encode **redox × folding**, not only Michaelis terms on NTP/DNA.
      {scale_info}
      FEATURES: {features}

    ebola n-protein (cell-free yield)_regression: |
      DATASET: {dataset_name}
      DOMAIN: Cell-free synthesis — **Ebola virus nucleoprotein (N-protein)** (NiCo21(DE3) lysate).
      TASK: Predict **Yield**; large viral protein + **RNA binding / oligomerization**:
      - Resource competition: **NTP and ribosome usage** scales super-linearly with length/oligomerization; **DNA template** may show strong saturation then decline (runoff, aggregation, resource drain).
      - Temperature and ionic conditions affect **soluble oligomer vs. aggregate**—different failure modes than GFP or scFv.
      OPTIMIZATION: Prioritize **DNA × NTP** and **size/resource** narratives when residuals track high-DNA or high-expression conditions.
      {scale_info}
      FEATURES: {features}

    concrete: |
      DATASET: Concrete Strength
      DOMAIN: Materials Science / Civil Engineering
      Key mechanisms: Water-cement ratio (inverse-U), cement-water interactions, curing time effects
      FEATURES: {features}
    esol: |
      DATASET: ESOL (Water Solubility)
      DOMAIN: Computational Chemistry / Drug Discovery
      TASK: Predict aqueous solubility from molecular structure
      Use molecular properties: num_hydroxyl_groups (+), num_halogen (-), molecular_weight (-), num_rings (-), num_nitrogen/num_oxygen (+)
      {scale_info}
      FEATURES: {features}
    # DeepChem regression aliases (018)
    delaney: *molecular_regression
    lipo: *molecular_regression
    lipophilicity: *molecular_regression
    deepchem: *molecular_regression

    # TabArena regression datasets (018)
    diabetes: &diabetes |
      DATASET: sklearn Diabetes
      DOMAIN: Medical / Clinical Prediction
      TASK: Predict disease progression score measured 1 year after baseline
      
      FEATURE SEMANTICS:
      | Feature | Name | Biological Meaning | Typical Relationship |
      |---------|------|-------------------|---------------------|
      | age | Age | Patient age (standardized) | Positive correlation with progression |
      | sex | Sex | Binary indicator | May have sex-specific effects |
      | bmi | BMI | Body mass index (standardized) | Higher BMI → worse progression |
      | bp | BP | Average blood pressure (standardized) | Higher BP → worse progression |
      | s1 | TC | Total serum cholesterol | Higher cholesterol → worse progression |
      | s2 | LDL | Low-density lipoprotein ("bad" cholesterol) | Higher LDL → worse progression |
      | s3 | HDL | High-density lipoprotein ("good" cholesterol) | Higher HDL → PROTECTIVE (inverse relationship) |
      | s4 | TCH | Total cholesterol / HDL ratio | Higher ratio → worse progression (atherogenic risk) |
      | s5 | LTG | Log of serum triglycerides | Often the STRONGEST predictor - higher → worse progression |
      | s6 | GLU | Blood glucose level | Higher glucose → worse progression |
      
      KEY RELATIONSHIPS:
      - Higher BMI, BP, LDL, triglycerides (s5) → worse progression (positive coefficients)
      - Higher HDL (s3) → PROTECTIVE (use NEGATIVE coefficient or inverse)
      - s5 (log triglycerides) is often the STRONGEST predictor
      - Common interactions: BMI × BP (metabolic stress), s4 × s5 (lipid metabolism), age × risk factors
      - {scale_info}
      
      FEATURES: {features}
