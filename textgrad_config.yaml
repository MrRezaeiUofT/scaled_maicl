      TASK: Predict cellular localization class from sequence-derived numeric features.
      GUIDANCE:
      - Use 1-2 dominant features as localization signals; add interactions for ambiguous classes.
      - Prefer monotone score terms + a few contrasts (e.g., signal-peptide-like vs cytosolic).
      FEATURES: {features}
    adult: |
      DATASET: {dataset_name} (Adult Income)
