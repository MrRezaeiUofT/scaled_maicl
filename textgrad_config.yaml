      TASK: Predict income class from demographics/education/employment features.
      MECHANISTIC PRIORS:
      - Human capital: education (and education_num) + occupation/skill signals.
      - Seniority/work intensity: age and hours_per_week saturate; professional roles amplify.
      - Capital_gain is often a “spiky” high-income indicator; model it with a strong saturating boost.
      GUIDANCE:
      - Use 2 class scores (<=50K vs >50K) with interactions like education×hours and capital_gain gating.
      FEATURES: {features}
