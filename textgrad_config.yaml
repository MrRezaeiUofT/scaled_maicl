# TextGrad Configuration
# This file contains all prompts and templates used by the TextGrad optimizer

prompts:
  optimization:
    main_template: |
      You are optimizing a SCIENTIFIC MECHANISM that is currently making systematic errors.
      {dataset_context}
      {iteration_history_context}

      CURRENT MECHANISM (making errors):

      {mechanism}

      {error_feedback}
      {class_dist_context}

      {feature_instruction}

      YOUR TASK: BUILD A STRONG, INDEPENDENT PREDICTIVE MECHANISM

      🎯 PRIMARY GOAL: Your mechanism must work WELL ON ITS OWN as a standalone predictor.
      While it may complement other mechanisms in an ensemble, it should be independently predictive.
      Focus on building a mechanism that can make accurate predictions by itself, not just one that fills gaps.
      
      🧠 USE YOUR INTERNAL KNOWLEDGE AND REASONING:
      - Think deeply about the domain and what makes different classes distinct
      - Use your understanding of the problem to guide feature selection and interaction design
      - Reason about relationships: "If class A has high feature X, and class B has low feature X, then feature X is a discriminator"
      - Consider domain-specific knowledge: e.g., for vehicles, think about what makes a bus vs van vs sedan distinctive
      - Use analogical reasoning: "This is similar to [domain concept], so I should model it as [mathematical form]"
      - Think step-by-step: First understand the problem, then design the mechanism, then optimize coefficients
      
      EXECUTABILITY + ROBUSTNESS (CRITICAL):
      - Provide EXACTLY ONE single-line formula that starts with: "Formula: ŷ = ...".
      - Multi-class classification (>=3 classes): you SHOULD define per-class scores (score_0, score_1, ...)
        and then select the class via argmax. This is preferred over nested if/else trees.
      - Binary classification (2 classes): you MAY use a single score and a threshold, or a 2-score comparison.
      - Avoid brittle boolean gates like (feature > 0.6). Prefer smooth numeric gating:
        max(0, feature - threshold) or feature/(threshold + feature).
      - NOTE: Features are often scaled to a small range; products of many scaled features can vanish.
        Keep multiplicative interactions small (2 features) OR scale them explicitly with a larger coefficient.

      CRITICAL: Your mechanism formula has coefficients (like 0.783, 0.301, 0.194, etc.) that are starting values. 
      You MUST learn new coefficient values based on performance metrics (R² and MAE for regression, Accuracy and F1 for classification).
      Don't just add interaction terms - actually change the base coefficients to improve performance.
      
      INDEPENDENT PERFORMANCE TARGET:
      - Your mechanism should achieve strong R² and low MAE when used alone (LLM-only evaluation)
      - Don't specialize only for complementarity - build a robust standalone predictor
      - Use all relevant features and interactions that improve independent predictive power

      Follow this diagnostic process (THINK DEEPLY AT EACH STEP):

      1️⃣ ANALYZE THE ERROR PATTERNS (USE REASONING):

         - What are the systematic failures? (overestimation? underestimation? class confusion?)
         
         - REASON ABOUT ERRORS: Why is the mechanism failing? What patterns do you see?
         
         - Which features correlate with large errors?
         
         - Are errors worse for high/low values of specific features?
         
         - THINK ABOUT CLASS CONFUSION: Which classes are being confused? Why might that be?
         
         - USE DOMAIN KNOWLEDGE: What do you know about this problem that could explain the errors?

      2️⃣ IDENTIFY THE ROOT CAUSE (THINK MECHANISTICALLY):

         - Is a key feature missing from the mechanism?

         - Are feature interactions modeled incorrectly?

         - Are there saturation effects or thresholds being ignored?

         - Is the functional form (linear/nonlinear) appropriate?

         - COMPLEXITY GUIDANCE: Follow the complexity guidance provided above. If errors show
           nonlinear patterns (errors increase faster than linear), use nonlinear transformations.
           If errors appear relatively linear, simple forms may work better. Let the data guide
           complexity rather than forcing it. Consider:
           * Saturation effects: feature/(K+feature) or tanh-like responses (if errors show saturation)
           * Multiplicative interactions: feature1 * feature2 (if interaction patterns detected)
           * Threshold effects: max(0, feature - threshold) or step functions (if threshold effects seen)
           * Polynomial terms: feature^2, feature^3 (only with clear mechanistic justification)
           * Ratios and divisions: feature1/feature2 (if ratio relationships make sense)
           * Exponential/logarithmic relationships (only if scientifically justified)

      3️⃣ PROPOSE TARGETED FIX (USE REASONING AND KNOWLEDGE):

         - THINK ABOUT THE DOMAIN: Use your knowledge of the problem to design better mechanisms
           * What makes different classes distinct? (e.g., for vehicles: buses are boxy with many windows)
           * What features should interact? (e.g., COMPACTNESS and CIRCULARITY both relate to shape)
           * What nonlinear relationships make sense? (e.g., saturation when features get very high)
         
         - REASON ABOUT FEATURE INTERACTIONS: Don't just add random interactions - think about which features should interact and why
           * "If feature A is high AND feature B is low, that might indicate class X"
           * "Features A and B both relate to [concept], so they should interact nonlinearly"
         
         - BUILD INDEPENDENT PREDICTIVE POWER: Focus on making your mechanism work well as a standalone predictor. Include all features and interactions that improve independent performance, not just those that complement other mechanisms.

         - LEARN NEW COEFFICIENTS: Don't just add interaction terms - actually adjust the base coefficients (0.783, 0.301, etc.) based on performance metrics. If R² is low or MAE is high, increase/decrease coefficients systematically. Try different coefficient values (e.g., 0.5, 1.0, 1.5, 2.0) to find what improves performance.
         
         - CREATE INTERMEDIATE VARIABLES: Think about domain concepts (e.g., "boxiness", "elongation_factor") and model them as intermediate variables
           * intermediate = f(feature1, feature2) where f captures a meaningful concept
           * Example: boxiness = COMPACTNESS * (1 - CIRCULARITY) / (0.1 + COMPACTNESS * (1 - CIRCULARITY))

         - Add the missing feature or interaction that explains errors AND improves standalone performance

         - Adjust coefficients to improve performance metrics (R² and MAE for regression, Accuracy and F1 for classification) - NOT just to reduce loss

         - PRIORITIZE INDEPENDENT ACCURACY: Your mechanism should predict well on its own. If a feature or interaction improves standalone R²/MAE, include it even if it overlaps with other mechanisms.

         - CRITICAL: Do NOT use feature importance values (like 0.392, 0.150) as coefficients. These are NOT coefficients - they only indicate which features are important. Learn proper coefficients (typically 0.1-2.0 range) by optimizing performance metrics.

         - CRITICAL: When you see coefficients like 0.783, 0.301, 0.194 in the formula, these are starting values that need to be OPTIMIZED. Don't keep them the same - try different values (e.g., 0.5, 1.0, 1.2, 1.5) and see which improves R² and MAE. The goal is to find coefficients that maximize R² and minimize MAE.

         - Change functional form if needed - FOLLOW COMPLEXITY GUIDANCE:
           * If complexity guidance suggests nonlinearity: use saturation, interactions, thresholds
           * If complexity guidance suggests linear/simple: use simpler forms, let data guide
           * Saturation: feature/(K+feature) for Michaelis-Menten-like responses (if saturation detected)
           * Multiplicative interactions: feature1 * feature2 for synergistic effects (if interactions detected)
           * Thresholds: max(0, feature - threshold) or conditional logic (if threshold effects seen)
           * Polynomial terms: feature^2, feature^3 (only with clear mechanistic reason)
           * Ratios: feature1/feature2 for relative effects (if ratio relationships make sense)
           * Other nonlinear forms that capture the underlying process (when data supports it)

         - IMPORTANT: Follow the complexity guidance provided above. Don't force nonlinearity if
           the data doesn't support it, but do use it when error patterns indicate it's needed.

         - Ensure all terms have mechanistic justification

      4️⃣ VALIDATE THE FIX:

         - Will this fix improve performance metrics (R² and MAE for regression, Accuracy and F1 for classification) in the specific examples shown?

         - Does it make scientific sense for this dataset?

         - Are all feature names correct?

         - Are coefficients learned from performance metrics (not copied from feature importance values)?

      QUALITY REQUIREMENTS:

      ✓ Use actual feature names (not x1, x2, etc.)

      ✓ Directly address the error patterns identified above

      ✓ Keep mechanism interpretable (3-5 key terms)

      ✓ Each term must have clear mechanistic meaning

      ✓ For regression: Output must be in scaled range [{scale_min}, {scale_max}] (when scaling is enabled)
      ✓ For classification: Output must be a CLASS INDEX (integer: 0, 1, 2, ...), NOT a probability or continuous value
        - Use thresholds, argmax, or conditional logic to map feature values to class indices
        - DO NOT use sigmoid or other probability functions - output must be a discrete class index
        - Be creative and expressive in your formulation while maintaining mechanistic interpretability
        - IMPORTANT (multi-class): prefer per-class score_k equations + FINAL PREDICTION: ŷ = argmax([score_0, score_1, ...])
        - Avoid nested if/else trees for multi-class; they are brittle and hard to optimize

      OUTPUT FORMAT:

      THINKING PROCESS (OPTIONAL BUT ENCOURAGED):
      
      [Briefly explain your reasoning: What did you observe? What domain knowledge did you use? How did you reason about the fix?]
      
      DIAGNOSIS:

      [1-2 sentences: What is causing the errors based on the patterns above? Use reasoning to explain WHY the mechanism is failing.]

      FIX:

      [1-2 sentences: What specific change will reduce these errors? Explain HOW this fix addresses the root cause.]

      REVISED MECHANISM:

      [Clear description of the causal process - explain HOW the mechanism works and WHY it should perform better. Use domain knowledge to justify your design choices.]

      Formula: ŷ = [executable expression with ACTUAL feature names]
      {formula_instruction}
      
      NOTE: If you used domain knowledge or reasoning to design this mechanism, briefly mention it (e.g., "Based on knowledge that buses have high HOLLOWS_RATIO, I designed score_0 to emphasize this feature with saturation").

      CRITICAL REQUIREMENTS FOR YOUR FORMULA:
      - If the current formula has coefficients like 0.783, 0.301, 0.194, you MUST change these to new values (e.g., 0.5, 1.0, 1.2, 1.5, 2.0) that improve R² and MAE
      - Don't just copy the same coefficients and add interaction terms - actually learn new coefficient values
      - Try systematically: if R² is low, increase important feature coefficients; if MAE is high, adjust coefficients to reduce errors
      - The goal is to maximize R² and minimize MAE through coefficient optimization, not just adding terms

      Now provide YOUR fix:

  update_mechanism:
    template: |
      Update this mechanism by incorporating the improvement suggestions:

      Original mechanism:
      {mechanism}

      Improvement suggestions:
      {gradient}

      {update_instruction}

      HARD OUTPUT REQUIREMENTS:
      - Output the FULL updated mechanism text (not just a short summary).
      - Preserve/produce a clean structure that downstream code can reuse.
      - Include exactly ONE line starting with "Formula:" that contains the executable prediction expression.
      - For MULTI-CLASS classification, you MUST define score_0..score_{n_classes_minus_1} and then:
        FINAL PREDICTION:
        ŷ = argmax([score_0, score_1, ...])
      - ABSOLUTELY AVOID nested if-else decision trees as the main formula; use per-class scores + argmax instead.
      - Do NOT include code blocks.

      Updated mechanism:

  update_instructions:
    classification: |
      Update the mechanism to improve Accuracy and F1 score (primary metrics) by refining feature interactions, thresholds, and decision boundaries.
      Do NOT use feature importance values as coefficients — learn proper coefficients (0.1–2.0 range) by optimizing Accuracy and F1.
      Preserve correctness on easy cases and focus on systematic residual patterns.

      Multi-class rule: prefer per-class score_k equations + argmax; avoid nested if chains.

    dataset_specific:
      lymphography:
        classification: |
          LYMPHOGRAPHY-SPECIFIC CONTRACT:
          - Treat many inputs as discrete/ordinal levels (often {0.00, 0.33, 0.67, 1.00}). Use thresholds like 0.17/0.50/0.83.
          - Classes (exact): 0=fibrosis, 1=malign_lymph, 2=metastases, 3=normal.
          - Include an explicit normal gate based on lymphatics (e.g., gate_norm = 1 if lymphatics>=0.67 else 0).
          - Include at least TWO nonlinear interactions (e.g., (a*b)/(K+a*b) or a/(K+a)*b/(K+b)).
          - For each CLASS section, include a concrete SIGNATURE line (high/low + thresholds) and contrast one confusing class.

    regression: "Update the mechanism to maximize R² and minimize MAE (primary metrics) by refining monotonic trends, curvature, and interaction terms. Do NOT use feature importance values as coefficients - learn proper coefficients (0.1-2.0 range) by optimizing R² and MAE. Explicitly address residual bias and outliers while keeping predictions in the correct scaled range."

templates:
  feature_instruction:
    deepchem: |
      
      CRITICAL: This is a molecular dataset (DeepChem). You will receive SMILES strings as input, NOT ECFP bit features.
      
      DO NOT use ECFP bit features (ecfp_bit_0, ecfp_bit_1, etc.) in your mechanism formula.
      
      ALLOWED RDKit DESCRIPTORS (use ONLY these exact names / calls):
      - molecular_weight(SMILES)
      - num_atoms(SMILES)
      - num_rings(SMILES)
      - is_aromatic(SMILES)
      - num_halogen(SMILES)
      - num_hydroxyl_groups(SMILES)
      - num_nitrogen(SMILES)
      - num_oxygen(SMILES)
      - num_hbd(SMILES)
      
      ABSOLUTE PROHIBITIONS:
      - Do NOT use any ecfp_bit_* identifiers.
      - Do NOT use non-whitelisted descriptors like logp, tpsa, qed, fragments, SMARTS/substructure matches, etc.
      
      Your mechanism should reason about molecular STRUCTURE and PROPERTIES, not ECFP fingerprint bits.
      Example: "More num_hydroxyl_groups(SMILES) increases solubility" NOT "ecfp_bit_27 correlates with solubility"
      
      When writing your formula, use molecular properties or structural features that can be computed from SMILES, not ECFP bit indices.
      
    standard: |
      
      CRITICAL: USE ACTUAL FEATURE NAMES
      
      Your mechanism MUST use these exact feature names:
      
      {feature_list}
      
      Example: Instead of "x1 + x2", write "{feature_example}"

  dataset_contexts:
    # -----------------------------
    # Reusable templates (anchors)
    # -----------------------------
    tabular_classification: &tabular_classification |
      DATASET: {dataset_name}
      DOMAIN: Tabular Classification
      TASK: Predict a discrete class label from input features.
      GUIDANCE:
      - Use thresholds/piecewise logic and feature interactions.
      - For multi-class, score each class and use argmax.
      - Pay attention to minority classes; avoid predicting only the majority.
      FEATURES: {features}

    lymphography_classification: |
      DATASET: {dataset_name}
      DOMAIN: Medical Tabular Classification (Lymphography)
      TASK: 4-way classification with ordinal/discrete inputs (often levels like 0.00/0.33/0.67/1.00).

      CLASSES (exact):
      0=fibrosis, 1=malign_lymph, 2=metastases, 3=normal

      HARD STYLE CONTRACT:
      - Use per-class scores score_0..score_3 and FINAL PREDICTION: ŷ = argmax([score_0, score_1, score_2, score_3]).
      - Include a "normal gate" driven by lymphatics (e.g., lymphatics>=0.67) and at least TWO nonlinear interactions
        of the form (a*b)/(K+a*b) or a/(K+a)*b/(K+b).
      - For EACH class: include a concrete SIGNATURE line (thresholds, high/low) and contrast one confusing class.

      FEATURES: {features}

    tabular_regression: &tabular_regression |
      DATASET: {dataset_name}
      DOMAIN: Tabular Regression
      TASK: Predict a continuous target from input features.
      GUIDANCE:
      - Use saturations/thresholds/interactions when error patterns indicate them.
      - Keep the final formula stable (avoid extreme coefficients/constants).
      FEATURES: {features}

    molecular_classification: &molecular_classification |
      DATASET: {dataset_name}
      DOMAIN: Molecular Classification (SMILES)
      TASK: Predict class label from molecular structure.
      GUIDANCE:
      - Use molecular properties derived from SMILES (molecular_weight, num_rings, num_halogen, num_hydroxyl_groups, num_nitrogen, num_oxygen).
      - Do NOT use ECFP bit features.
      FEATURES: SMILES + derived properties

    molecular_regression: &molecular_regression |
      DATASET: {dataset_name}
      DOMAIN: Molecular Regression (SMILES)
      TASK: Predict a continuous molecular property from molecular structure.
      GUIDANCE:
      - Use molecular properties derived from SMILES (molecular_weight, num_rings, num_halogen, num_hydroxyl_groups, num_nitrogen, num_oxygen).
      - Do NOT use ECFP bit features.
      FEATURES: SMILES + derived properties

    # -----------------------------
    # DeepChem (explicit) contexts
    # -----------------------------
    esol_regression: |
      DATASET: {dataset_name} (DeepChem ESOL / Delaney-like)
      DOMAIN: Molecular Regression (SMILES)
      TARGET: Higher value = MORE soluble .
      ALLOWED RDKit DESCRIPTORS (ONLY):
      - molecular_weight(SMILES), num_atoms(SMILES), num_rings(SMILES), is_aromatic(SMILES), num_halogen(SMILES),
        num_hydroxyl_groups(SMILES), num_nitrogen(SMILES), num_oxygen(SMILES), num_hbd(SMILES)
      EXPECTED DIRECTIONS (typical):
      - Polarity (num_oxygen/num_nitrogen/num_hydroxyl_groups/num_hbd) -> increase solubility
      - Hydrophobic bulk (num_rings/is_aromatic/num_halogen/molecular_weight/num_atoms) -> decrease solubility
      REQUIREMENTS:
      - Use at least one saturation nonlinearity (x/(K+x), log(1+x), exp(-x))
      - Use at least one interaction term (polarity × hydrophobe or polarity dampening hydrophobe)
      - ABSOLUTE: never use ecfp_bit_* or any non-whitelisted descriptor names

    delaney_regression: |
      DATASET: {dataset_name} (DeepChem Delaney / ESOL-like)
      DOMAIN: Molecular Regression (SMILES)
      Use the exact same constraints as ESOL:
      - Only: molecular_weight(SMILES), num_atoms(SMILES), num_rings(SMILES), is_aromatic(SMILES), num_halogen(SMILES),
        num_hydroxyl_groups(SMILES), num_nitrogen(SMILES), num_oxygen(SMILES), num_hbd(SMILES)
      - Never: ecfp_bit_* or any other descriptor names
      - Include one saturation + one interaction

    lipo_regression: |
      DATASET: {dataset_name} (DeepChem LIPO / Lipophilicity)
      DOMAIN: Molecular Regression (SMILES)
      TARGET: Higher value = MORE lipophilic (after scaling).
      ALLOWED RDKit DESCRIPTORS (ONLY):
      - molecular_weight(SMILES), num_atoms(SMILES), num_rings(SMILES), is_aromatic(SMILES), num_halogen(SMILES),
        num_hydroxyl_groups(SMILES), num_nitrogen(SMILES), num_oxygen(SMILES), num_hbd(SMILES)
      EXPECTED DIRECTIONS (typical):
      - Hydrophobic bulk (num_rings/is_aromatic/num_halogen/molecular_weight/num_atoms) -> increase lipophilicity
      - Polarity (num_oxygen/num_nitrogen/num_hydroxyl_groups/num_hbd) -> decrease lipophilicity
      REQUIREMENTS:
      - At least one saturation + one interaction (e.g., polarity dampens hydrophobe)
      - ABSOLUTE: never use ecfp_bit_* or any non-whitelisted descriptor names

    lipophilicity_regression: |
      DATASET: {dataset_name} (DeepChem Lipophilicity / LIPO)
      DOMAIN: Molecular Regression (SMILES)
      Use the exact same constraints as LIPO:
      - Only: molecular_weight(SMILES), num_atoms(SMILES), num_rings(SMILES), is_aromatic(SMILES), num_halogen(SMILES),
        num_hydroxyl_groups(SMILES), num_nitrogen(SMILES), num_oxygen(SMILES), num_hbd(SMILES)
      - Never: ecfp_bit_* or any other descriptor names
      - Include one saturation + one interaction

    enzyme_regression: &enzyme_regression |
      DATASET: {dataset_name}
      DOMAIN: Enzyme Activity Regression
      TASK: Predict enzyme activity/affinity from sequence/substrate-derived features.
      GUIDANCE:
      - Use sequence and substrate complexity terms; include saturations/inhibition when reasonable.
      FEATURES: {features}

    enzyme_classification: &enzyme_classification |
      DATASET: {dataset_name}
      DOMAIN: Enzyme Activity Classification
      TASK: Predict a discrete class from sequence/substrate-derived features.
      GUIDANCE:
      - Use class scores + thresholds/argmax.
      FEATURES: {features}

    enzyme: |
      DATASET: Enzyme Activity Prediction
      DOMAIN: Biochemistry / Biocatalysis
      KEY MECHANISMS: Michaelis-Menten kinetics, cofactor dependencies, temperature optima, pH effects, competitive inhibition
      COMMON ERROR SOURCES:
      - Ignoring saturation effects (use Michaelis-Menten: V*S/(Km+S))
      - Missing cofactor synergies (multiply cofactor * substrate)
      - Not modeling temperature optimum (use Gaussian or inverse-U shape)
      - Ignoring pH effects (optimal pH range, drops outside)
      - Missing competitive inhibition (divide by (1 + I/Ki))
      FEATURES: {features}
    protein: |
      DATASET: Protein Expression Yield
      DOMAIN: Molecular Biology / Synthetic Biology
      KEY MECHANISMS: Translation machinery, nucleotide pools, amino acid availability, cofactor requirements
      COMMON ERROR SOURCES:
      - Not capturing NAD/ATP as limiting factors (use saturation)
      - Missing tRNA-amino acid dependencies (multiply tRNA * amino_acids)
      - Ignoring magnesium as cofactor (add Mg^2+ term)
      - Not modeling template concentration effects
      - Missing competitive resource allocation
      FEATURES: {features}
    # Regression biotech datasets (018)
    protein_expression: *tabular_regression
    protein_expression_all: *tabular_regression
    dataset_102: *tabular_regression
    gfp_yield: |
      DATASET: GFP Yield Prediction (Cell-Free Expression)
      DOMAIN: Synthetic Biology / Cell-Free Protein Expression
      TASK: Predict GFP (Green Fluorescent Protein) production yield from experimental conditions
      KEY MECHANISMS:
      - Temperature optimum: Transcription/translation has optimal temperature (typically 30-37°C)
      - Magnesium saturation: Mg2+ is essential cofactor for DNA/RNA polymerases and ribosomes (Michaelis-Menten: Mg/(Km+Mg), Km ~ 8-12 mM)
      - Potassium saturation: K+ stabilizes ribosomes and affects translation (saturation: K/(Km+K), Km ~ 100-150 mM)
      - NTP saturation: Nucleotides required for transcription (strong saturation: NTPs/(Km+NTPs), Km ~ 0.5-1.5 mM)
      - DNA template saturation: Transcription initiation depends on DNA (saturation: DNA/(Km+DNA), Km ~ 5-15 nM)
      - Synergistic interactions: Mg2+ * K+ for ribosome stability, Temperature * Mg2+ (higher temp needs more Mg)
      - Resource competition: Very high DNA concentrations may compete for limited resources
      COMMON ERROR SOURCES:
      - Ignoring temperature optimum (use Gaussian or inverse-U: exp(-((T-T_opt)^2)/(2*sigma^2)))
      - Missing Mg2+ saturation (use Michaelis-Menten: Mg/(Km_Mg+Mg) where Km_Mg ~ 0.08-0.12 for scaled data)
      - Not modeling K+ effects (use saturation: K/(Km_K+K) where Km_K ~ 0.5-0.75 for scaled data)
      - Ignoring NTP saturation (critical limiting factor: NTPs/(Km_NTP+NTPs) where Km_NTP ~ 0.01-0.03 for scaled data)
      - Missing DNA template effects (saturation: DNA/(Km_DNA+DNA) where Km_DNA ~ 0.05-0.15 for scaled data)
      - Not capturing Mg2+ * K+ synergy (multiply: (Mg/(Km_Mg+Mg)) * (K/(Km_K+K)))
      - Missing Temperature * Mg2+ interaction (higher temperature requires more Mg for enzyme stability)
      - Ignoring NTPs * DNA interaction (both needed for transcription: multiply saturation terms)
      - Linear modeling instead of saturation kinetics (use Michaelis-Menten forms)
      - Not accounting for resource competition at high DNA concentrations
      FEATURES: {features}
      CRITICAL SCALING INFORMATION:
      {scale_info}
      All predictions must be clipped to [{scale_min}, {scale_max}] using clip(expression, {scale_min}, {scale_max})
      NOTE: All feature values are scaled to [0, 1]. Adjust Km values proportionally (e.g., if Mg range is 0-20 mM scaled to [0,1], then Km_Mg ~ 0.4-0.6 for 8-12 mM optimal).
    concrete: |
      DATASET: Concrete Strength
      DOMAIN: Materials Science / Civil Engineering
      KEY MECHANISMS: Cement hydration, water-cement ratio, aggregate properties, curing time
      COMMON ERROR SOURCES:
      - Not capturing optimal water-cement ratio (inverse-U shape)
      - Missing cement-water interaction (multiply components)
      - Ignoring curing time effects (logarithmic or root)
      - Not modeling aggregate size distribution
      - Missing temperature effects on hydration
      FEATURES: {features}
    esol: |
      DATASET: ESOL (Water Solubility)
      DOMAIN: Computational Chemistry / Drug Discovery
      TASK: Predict aqueous solubility (log solubility in mols per litre) from molecular structure
      KEY MECHANISMS: 
      - Polar functional groups (hydroxyl, carboxyl, amino) increase solubility via hydrogen bonding
      - Molecular weight and hydrophobicity decrease solubility
      - Aromatic rings and halogens reduce water solubility
      - Number of rings affects molecular flexibility and solubility
      COMMON ERROR SOURCES:
      - Ignoring molecular weight effects (larger molecules less soluble)
      - Missing functional group contributions (hydroxyl groups strongly increase solubility)
      - Not accounting for halogen effects (Cl, Br, F reduce solubility)
      - Overlooking ring count effects (more rings often reduce flexibility and solubility)
      - Incorrect output scaling (must match target range)
      CRITICAL SCALING INFORMATION:
      {scale_info}
      All predictions must be clipped to [{scale_min}, {scale_max}] using clip(expression, {scale_min}, {scale_max})
      FEATURES: {features}
      NOTE: This dataset uses SMILES strings. Work with molecular properties (molecular_weight, num_hydroxyl_groups, num_halogen, num_rings, etc.) derived from SMILES, NOT ECFP bit features.
    # DeepChem regression aliases (018)
    delaney: *molecular_regression
    lipo: *molecular_regression
    lipophilicity: *molecular_regression
    deepchem: *molecular_regression

    # TabArena regression datasets (018)
    diabetes_regression: |
      DATASET: {dataset_name} (Diabetes Progression)
      DOMAIN: Clinical Tabular Regression
      TASK: Predict disease progression from patient biomarkers/features.
      MECHANISTIC PRIORS:
      - Adiposity/metabolic load (often BMI-like) interacts with blood pressure and lipid/glucose markers.
      - Age can gate risk but saturates (older age increases risk up to a plateau).
      - Use 1-2 key interactions rather than many small terms (keeps it robust).
      COMMON FORMS:
      - sat(x)=x/(K+x) to model diminishing returns of a biomarker
      - synergy: sat(BMI)*sat(BP) or sat(glucose)*sat(triglycerides)
      FEATURES: {features}
      {scale_info}
    housing: *tabular_regression
    bike: *tabular_regression
    insurance: *tabular_regression
    energy: *tabular_regression
    airfoil: *tabular_regression
    yacht: *tabular_regression
    auto: *tabular_regression
    abalone: *tabular_regression
    winequality: *tabular_regression
    students: *tabular_regression
    diamonds: *tabular_regression
    house-prices: *tabular_regression
    airbnb: *tabular_regression

    # Enzyme regression dataset names (018)
    aminotransferase: *enzyme_regression
    olea: *enzyme_regression
    halogenase_nabr: *enzyme_regression
    halogenase_nacl: *enzyme_regression
    phosphatase_achiral: *enzyme_regression
    phosphatase_chiral: *enzyme_regression
    davis: *enzyme_regression
    davis_filtered: *enzyme_regression

    # Classification datasets (017)
    car: *tabular_classification
    iris: |
      DATASET: {dataset_name} (Iris)
      DOMAIN: Simple Geometry / Tabular Classification
      TASK: Predict iris species from sepal/petal measurements.
      STRONG SIGNALS (typical):
      - Petal length & petal width dominate.
      - Setosa: very small petals (strongly separable).
      - Versicolor vs Virginica: medium vs large petals; sepal width/length can help as secondary.
      GUIDANCE:
      - Use 3 class scores and argmax.
      - Prefer smooth saturations/soft-thresholds around petal-size ranges vs hard step functions.
      FEATURES: {features}
    wine: *tabular_classification
    zoo: |
      DATASET: {dataset_name} (Zoo)
      DOMAIN: Discrete Traits / Tabular Classification
      TASK: Predict animal class from mostly binary traits (and often legs count).
      STRONG RULES (typical UCI zoo):
      - Mammal: milk=1 and hair=1
      - Bird: feathers=1 and eggs=1
      - Fish: fins=1 and aquatic=1
      - Insect: backbone=0 and legs≈6
      - Amphibian/Reptile: eggs=1 with aquatic/breathes/toothed patterns
      GUIDANCE:
      - Build class scores as weighted sums of trait matches; include contradictions as penalties.
      - Use legs as a strong discriminator when present.
      FEATURES: {features}
    glass: *tabular_classification
    vehicle: |
      DATASET: {dataset_name} (Vehicle Silhouettes)
      DOMAIN: Computer Vision / Shape Analysis / Tabular Classification
      TASK: Classify vehicle type (bus, opel, saab, van) from 18 shape-based features extracted from silhouettes.
      
      CLASSES (exact):
      0=bus, 1=opel, 2=saab, 3=van
      
      DOMAIN KNOWLEDGE - USE YOUR INTERNAL KNOWLEDGE:
      Think about what makes each vehicle type distinctive:
      - BUS: Large, boxy, high HOLLOWS_RATIO (windows/doors), elongated rectangular shape, high DISTANCE_CIRCULARITY (deviates from circle)
      - OPEL: Medium sedan, moderate ELONGATEDNESS, balanced proportions, moderate COMPACTNESS and CIRCULARITY
      - SAAB: Similar to Opel but may have different aspect ratios, often more elongated, distinctive MAX.LENGTH_ASPECT_RATIO patterns
      - VAN: Box-like but smaller than bus, moderate HOLLOWS_RATIO, distinctive MAX.LENGTH_ASPECT_RATIO and SKEWNESS patterns
      
      KEY FEATURES AND THEIR MEANING:
      - HOLLOWS_RATIO: Ratio of hollow areas (windows, doors) - HIGH for buses, MODERATE for vans, LOWER for sedans
      - DISTANCE_CIRCULARITY: How far from a perfect circle - HIGH for elongated vehicles (buses, some vans)
      - ELONGATEDNESS: Length-to-width ratio - HIGH for buses and some vans, MODERATE for sedans
      - MAX.LENGTH_ASPECT_RATIO: Maximum length aspect ratio - DISTINCTIVE for each class
      - COMPACTNESS: How compact the shape is - LOWER for elongated vehicles, HIGHER for compact ones
      - CIRCULARITY: How circular the shape is - LOWER for elongated/boxy vehicles
      - SKEWNESS_ABOUT_MAJOR/MINOR: Asymmetry measures - can distinguish between similar classes
      
      CRITICAL THINKING PROCESS:
      1. REASON ABOUT VEHICLE SHAPES: Use your knowledge of vehicle types to understand what features should distinguish them
      2. IDENTIFY KEY DISCRIMINATORS: 
         - Bus vs others: HOLLOWS_RATIO is key (buses have many windows/doors)
         - Opel vs Saab: These are similar sedans - need subtle differences in ELONGATEDNESS, MAX.LENGTH_ASPECT_RATIO, and interactions
         - Van vs Bus: Both boxy, but van is smaller - use HOLLOWS_RATIO, COMPACTNESS, and size-related features
      3. MODEL NONLINEAR INTERACTIONS: Features interact nonlinearly - e.g., high COMPACTNESS + low CIRCULARITY might indicate van vs bus
      4. USE INTERMEDIATE VARIABLES: Create variables that capture shape concepts (e.g., "boxiness" = COMPACTNESS * (1 - CIRCULARITY))
      
      MECHANISTIC PRIORS:
      - Buses: High HOLLOWS_RATIO + high DISTANCE_CIRCULARITY + high ELONGATEDNESS
      - Opel: Moderate COMPACTNESS + moderate CIRCULARITY + specific ELONGATEDNESS range
      - Saab: Similar to Opel but different MAX.LENGTH_ASPECT_RATIO and SKEWNESS patterns
      - Vans: Moderate HOLLOWS_RATIO + moderate COMPACTNESS + specific MAX.LENGTH_ASPECT_RATIO
      
      COMMON ERROR PATTERNS TO AVOID:
      - Confusing Opel and Saab: Need to use SKEWNESS_ABOUT_MAJOR and MAX.LENGTH_ASPECT_RATIO interactions
      - Confusing Van and Bus: Use HOLLOWS_RATIO and COMPACTNESS interactions
      - Missing nonlinear interactions: Features don't just add - they interact in complex ways
      
      GUIDANCE:
      - Use per-class scores with ADVANCED NONLINEAR TRANSFORMATIONS
      - Create INTERMEDIATE VARIABLES that capture shape concepts (boxiness, elongation_factor, etc.)
      - Use saturation effects: feature / (K + feature) for diminishing returns
      - Use NONLINEAR INTERACTIONS: feature1 * feature2 / (K + feature1 * feature2)
      - Think about how features interact: e.g., COMPACTNESS * CIRCULARITY might distinguish bus from van
      - Optimize coefficients systematically: try different values (0.5, 1.0, 1.5, 2.0) to find what works
      - Use your knowledge of vehicle shapes to guide feature selection and interaction design
      
      FEATURES: {features}
    soybean: |
      DATASET: {dataset_name} (Soybean)
      DOMAIN: Plant Pathology / Tabular Classification
      TASK: Predict disease class from symptom/plant descriptors (often categorical/one-hot).
      GUIDANCE:
      - Treat one-hot/categorical indicators as symptoms; use AND-like interactions for co-occurring symptoms.
      - Penalize mutually exclusive symptom patterns; reward consistent symptom clusters.
      - Prefer sparse “signature” rules per class (few indicators + 1 interaction).
      FEATURES: {features}
    lymphography: |
      DATASET: {dataset_name} (Lymphography)
      DOMAIN: Medical Diagnosis / Tabular Classification
      TASK: Predict lymph node status from diagnostic features (often categorical/ordinal).
      GUIDANCE:
      - Build “severity” and “pattern” intermediate concepts: enlargement/defect/structure changes.
      - Use soft thresholds (ordinal increases) and 1-2 interactions (e.g., defect × enlargement).
      FEATURES: {features}
    ecoli: |
