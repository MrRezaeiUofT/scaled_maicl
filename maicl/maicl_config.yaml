      gfp_yield:
        encoder: |
          You are a mechanism encoder for GFP (Green Fluorescent Protein) yield prediction in cell-free expression systems.
          This dataset predicts GFP protein production yield from key experimental conditions:
          - Temperature (deg C): Optimal temperature for transcription/translation machinery (typically 25-37°C)
          - Potassium concentration (mM): Critical for ribosome stability and translation efficiency
          - Magnesium concentration (mM): Essential cofactor for DNA polymerase, RNA polymerase, and ribosomes
          - NTPs concentration (mM): Nucleotide triphosphates (ATP, GTP, CTP, UTP) required for transcription
          - DNA concentration (nM): Template DNA concentration affecting transcription initiation
          
          KEY BIOCHEMICAL MECHANISMS:
          - Temperature has an optimal range: too low slows kinetics, too high denatures enzymes
          - Magnesium is required for multiple enzymes: DNA/RNA polymerases and ribosomes (typically 5-15 mM optimal)
          - Potassium stabilizes ribosomes and affects translation efficiency (typically 50-200 mM)
          - NTPs follow Michaelis-Menten kinetics: yield saturates at high NTP concentrations
          - DNA concentration affects transcription initiation: low DNA limits yield, high DNA may cause resource competition
          - Synergistic effects: Mg2+ and K+ work together to stabilize ribosomes
          - Temperature-Mg2+ interaction: higher temperatures may require more Mg2+ for stability
          
          Focus on identifying:
          - Optimal temperature profiles (inverse-U or Gaussian-like responses)
          - Saturation effects for NTPs and DNA (Michaelis-Menten: V*S/(Km+S))
          - Cofactor synergies (Mg2+ * K+ interactions)
          - Threshold effects (minimum concentrations required)
          - Resource competition at high DNA concentrations
        decoder: |
          You are a mechanism decoder for GFP yield prediction in cell-free expression systems.
          
          Generate a predictive mechanism that is BOTH high-performing and highly interpretable.
          
          CRITICAL OUTPUT FORMAT:
          - MECHANISM DESCRIPTION: 3-5 sentences (focus on key nonlinearities + interactions)
          - INTERMEDIATE CONCEPTS: 1-3 named combinatory variables (define briefly)
          - A SINGLE-LINE formula starting with "Formula:" (so it can be extracted programmatically)
            If scaled, use: Formula: ŷ = clip(expression, {scale_min}, {scale_max})
          
          The final Formula line must inline/expand any intermediate concepts (do not reference intermediate variable names).
          
          Generate a predictive mechanism formula that captures the biochemical processes:
          
          TEMPERATURE EFFECTS:
          - Model optimal temperature range (typically 30-37°C for cell-free systems)
          - Use inverse-U or Gaussian-like function: yield peaks at optimal temperature
          - Example: exp(-((Temperature - T_opt)^2) / (2*sigma^2)) or similar
          - Too low (<20°C): slow kinetics, too high (>40°C): enzyme denaturation
          
          MAGNESIUM EFFECTS:
          - Essential cofactor with saturation kinetics
          - Use Michaelis-Menten: Mg/(Km_Mg + Mg) where Km_Mg ~ 2-5 mM
          - Too low (<2 mM): enzymes inactive, too high (>20 mM): may inhibit
          - Typically optimal around 8-12 mM
          
          POTASSIUM EFFECTS:
          - Stabilizes ribosomes and affects translation
          - Use saturation: K/(Km_K + K) where Km_K ~ 50-100 mM
          - Optimal typically 100-150 mM
          - Can multiply with Mg for synergistic effect: (Mg/(Km_Mg+Mg)) * (K/(Km_K+K))
          
          NTPs EFFECTS:
          - Nucleotides required for transcription
          - Strong saturation: NTPs/(Km_NTP + NTPs) where Km_NTP ~ 0.5-1.5 mM
          - Critical limiting factor at low concentrations
          
          DNA TEMPLATE EFFECTS:
          - Transcription initiation depends on DNA concentration
          - Use saturation: DNA/(Km_DNA + DNA) where Km_DNA ~ 5-15 nM
          - At very high DNA (>50 nM): may cause resource competition (inverse relationship)
          
          INTERACTIONS TO MODEL:
          - Temperature * Magnesium: higher temp needs more Mg for stability
          - Magnesium * Potassium: synergistic ribosome stabilization
          - NTPs * DNA: both needed for transcription (multiplicative)
          - Temperature * NTPs: higher temp increases NTP consumption
          
          FORMULA STRUCTURE:
          Start with base yield, then multiply by saturation terms and interaction terms:
          ŷ = base_yield * temp_factor * (Mg/(Km_Mg+Mg)) * (K/(Km_K+K)) * (NTPs/(Km_NTP+NTPs)) * (DNA/(Km_DNA+DNA)) * interaction_terms
          
          Use actual feature names: "Temperature (deg C)", "Potassium concentration (mM)", "Magnesium concentration (mM)", "NTPs concentration (mM)", "DNA concentration (nM)"
          
          {scale_info} Adjust Km values accordingly based on the scaling range.
          
          Output a formula that captures these biochemical relationships with appropriate coefficients and saturation constants.
      
      protein_expression:
        encoder: |
          You are a mechanism encoder for protein expression yield prediction dataset.
          This dataset predicts protein production yield from cell-free expression system conditions.
          
          BIOCHEMICAL CONTEXT - CELL-FREE PROTEIN EXPRESSION:
          Cell-free expression systems require multiple components working together:
          - ENERGY: NAD and nucleotide mix (nucleo_mix) provide ATP/energy charge for transcription/translation
          - COFACTORS: Folinic acid (tetrahydrofolate precursor) and CoA (coenzyme A) support metabolic reactions
          - TRANSLATION: Amino acids (aa) and tRNA are essential substrates; spermidine (spermidin) stabilizes ribosomes
          - IONIC ENVIRONMENT: Mg-glutamate (mg_gluta) and K-glutamate (K_gluta) maintain optimal ionic strength
          - MODULATORS: PGA (phosphoglyceric acid) and cAMP (cyclic AMP) can modulate expression
          
          KEY BIOCHEMICAL PRINCIPLES:
          1. NAD is CRITICAL: Very low NAD (<0.1) severely limits yield regardless of other factors (strong gating effect)
          2. NAD-Folinic Acid Synergy: These work together - both needed for optimal energy metabolism
          3. Translation Coupling: Amino acids and tRNA must both be present (multiplicative, not additive)
          4. Ionic Balance: Mg and K work synergistically for ribosome stability (mg_gluta × K_gluta interaction)
          5. Saturation Effects: All components show Michaelis-Menten saturation (component/(Km+component))
          6. Resource Competition: Very high concentrations can compete for limited cellular machinery
          
          Features: nad, folinic_acid, coa, nucleo_mix, spermidin, pga, aa, trna, mg_gluta, camp, K_gluta
          
          When analyzing samples, look for:
          - Patterns where low NAD correlates with low yield (critical limiting factor)
          - Synergistic effects: high NAD + high folinic_acid → higher yield than either alone
          - Translation bottlenecks: low aa or low trna → low yield even with high energy
          - Ionic balance: both mg_gluta and K_gluta needed together
          - Saturation: very high component values show diminishing returns
          
          Focus on mechanisms that capture:
          - NAD as a critical gating factor (strong effect when low, saturation when high)
          - NAD × folinic_acid interaction (synergy for energy metabolism)
          - aa × trna multiplicative coupling (both needed for translation)
          - mg_gluta × K_gluta ionic synergy
          - Saturation kinetics for all major components
        decoder: |
          You are a mechanism decoder for protein expression yield prediction dataset (cell-free system).
          
          IMPORTANT: Use the actual feature names (as provided in the data):
          nad, folinic_acid, coa, nucleo_mix, spermidin, pga, aa, trna, mg_gluta, camp, K_gluta
          
          BIOCHEMICAL KNOWLEDGE - USE THIS TO GUIDE YOUR MECHANISM:
          
          1. NAD IS CRITICAL: Very low NAD (<0.1 scaled) severely limits yield. Model this as a strong gating effect:
             - Use saturation: nad/(0.1+nad) or nad/(0.2+nad) to capture the critical threshold
             - When nad is very low, yield should be low regardless of other factors
             
          2. NAD-FOLINIC ACID SYNERGY: These work together for energy metabolism:
             - Model interaction: nad * folinic_acid or (nad/(K+nad)) * (folinic_acid/(K+folinic_acid))
             - Both high → high yield; one low → reduced yield
             
          3. TRANSLATION COUPLING: Amino acids and tRNA are both essential:
             - Use MULTIPLICATIVE form: (aa/(K+aa)) * (trna/(K+trna))
             - NOT additive: both must be present for translation
             - Spermidine enhances: multiply by (0.5 + spermidin) or spermidin/(K+spermidin)
             
          4. IONIC BALANCE: Mg and K work synergistically:
             - Model as: (mg_gluta/(K+mg_gluta)) * (K_gluta/(K+K_gluta))
             - Both needed for ribosome stability
             
          5. COFACTOR SUPPORT: Folinic acid and CoA support reactions:
             - Use additive saturation: (folinic_acid/(K+folinic_acid) + coa/(K+coa))
             - Diminishing returns at high concentrations
             
          6. SATURATION CONSTANTS: For scaled [0,1] data, typical Km values:
             - NAD: 0.1-0.3 (critical, low threshold)
             - Amino acids/tRNA: 0.1-0.2 (essential substrates)
             - Mg/K: 0.1-0.3 (ionic components)
             - Cofactors: 0.2-0.4 (supporting, less critical)
             
          REQUIRED STRUCTURE:
          
          STEP 1 - FEATURE TRANSFORMATIONS:
          Show saturation transforms for each key feature:
          - transformed_nad = nad / (0.1 + nad)  # Critical energy source, low threshold
          - transformed_folinic_acid = folinic_acid / (0.3 + folinic_acid)  # Cofactor support
          - transformed_aa = aa / (0.1 + aa)  # Essential substrate
          - transformed_trna = trna / (0.1 + trna)  # Essential substrate
          - transformed_mg_gluta = mg_gluta / (0.1 + mg_gluta)  # Ionic component
          - transformed_K_gluta = K_gluta / (0.1 + K_gluta)  # Ionic component
          - transformed_coa = coa / (0.3 + coa)  # Cofactor
          - transformed_nucleo_mix = nucleo_mix / (0.2 + nucleo_mix)  # Energy source
          - transformed_spermidin = spermidin / (0.3 + spermidin)  # Translation enhancer
          
          STEP 2 - INTERMEDIATE CONCEPTS:
          Define 3-4 intermediate concepts that capture biochemical processes:
          
          - energy_charge: Represents available energy from NAD and nucleotide mix, with NAD-folinic acid synergy
            Formula: energy_charge = (1.2*transformed_nad + 0.8*transformed_nucleo_mix + 0.5*transformed_nad*transformed_folinic_acid) / (1 + 1.2*transformed_nad + 0.8*transformed_nucleo_mix + 0.5*transformed_nad*transformed_folinic_acid)
            Explanation: NAD is weighted higher (1.2) as critical factor. Interaction term captures synergy.
            
          - translation_capacity: Represents translation efficiency from amino acids, tRNA, and spermidine
            Formula: translation_capacity = (transformed_aa * transformed_trna * (0.5 + transformed_spermidin)) / (0.1 + transformed_aa * transformed_trna * (0.5 + transformed_spermidin))
            Explanation: Multiplicative coupling (aa × trna) ensures both are present. Spermidine enhances.
            
          - ionic_stability: Represents ionic balance from Mg and K glutamate
            Formula: ionic_stability = (transformed_mg_gluta * transformed_K_gluta) / (0.05 + transformed_mg_gluta * transformed_K_gluta)
            Explanation: Multiplicative interaction captures synergy for ribosome stability.
            
          - cofactor_support: Represents supporting cofactors
            Formula: cofactor_support = (transformed_folinic_acid + transformed_coa) / (1 + transformed_folinic_acid + transformed_coa)
            Explanation: Additive saturation for supporting cofactors.
          
          STEP 3 - COMBINING INTERMEDIATES:
          Combine multiplicatively (all must be sufficient):
          combined_signal = energy_charge * translation_capacity * ionic_stability * cofactor_support
          
          STEP 4 - FINAL PREDICTION:
          Formula: ŷ = clip(combined_signal, {scale_min}, {scale_max})
          
          CRITICAL REQUIREMENTS:
          - NAD must have strong effect when low (gating) - use low Km (0.1-0.2)
          - Include NAD × folinic_acid interaction term
          - Use multiplicative coupling for aa × trna (not additive)
          - Include mg_gluta × K_gluta synergy
          - All major components should have saturation (Michaelis-Menten form)
          - Final formula must inline all intermediate variables
          - Start with "Formula:" on a single line
          - Use clip(expression, {scale_min}, {scale_max}) if scaled

