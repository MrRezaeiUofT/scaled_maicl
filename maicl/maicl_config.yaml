# MA-ICL Configuration
# This file contains all prompts and templates used by the MA-ICL system

# =========================
# LLM CONFIGURATION
# =========================
llm:
  # Temperature for LLM predictions (0.0 = deterministic, 1.0+ = more creative)
  # Default: 0.8
  temperature: 0.8

prompts:
  # =========================
  # ATTENTION PROMPTS
  # =========================
  attention:
    compute_weights: |
      Compute attention weights for mechanism aggregation.
      Consider: prediction confidence, mechanism relevance to input, consistency with other predictions.

  # =========================
  # PREDICTION PROMPTS
  # =========================
  prediction:
    single_mechanism: |
      You are applying a SCIENTIFIC MECHANISM to make a prediction.

      MECHANISM (this describes a causal process):
      {mechanism}

      Your task: REASON THROUGH the mechanism's textual description to make a prediction.

      CRITICAL APPROACH:

      1. READ and UNDERSTAND the textual description:

         - Focus on the MECHANISM DESCRIPTION section (the narrative story)
         - What causal process does it describe in words?
         - Which features play which roles (substrate, catalyst, inhibitor)?
         - What are the key interactions described in the text?

      2. REASON through the narrative step-by-step:

         - Follow the textual description's logic: "When X is high and Y is low, then..."
         - Apply the intermediate concepts described in the text
         - Use the textual reasoning, not just a formula
         - If a formula is provided, use it as a guide, but prioritize the textual logic

      3. CALCULATE the prediction:

         - Work through the intermediate steps described in the text
         - Apply the transformations and interactions as described
         - Show your reasoning based on the textual mechanism

      4. SANITY CHECK:

         - Does the prediction make mechanistic sense based on the description?
         - Are feature values in reasonable ranges?
         - Does the causal chain from the text hold?{few_shot_section}

      Input features:

      {input_features}

      {task_instruction}

      {agent_format}

      EXECUTION EXAMPLE:

      Mechanism Description: "NAD provides energy via saturation kinetics - as NAD increases, the energy contribution increases but saturates at high levels. tRNA enhances the process synergistically - when tRNA is present, it multiplies the effectiveness of the NAD-driven energy."

      Formula (optional guide): ŷ = 0.6 * nad/(0.3+nad) * (1+0.5*trna)

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning (following the textual description):

      - Step 1: NAD provides energy with saturation. At nad=0.7, we're in the saturation regime (above 0.3), so energy contribution is high but not maximum. The saturation term gives: 0.7/(0.3+0.7) = 0.7, scaled by 0.6 = 0.42

      - Step 2: tRNA enhances synergistically. With trna=0.4, the enhancement factor is 1 + 0.5*0.4 = 1.2, meaning 20% boost

      - Step 3: Combined effect: The NAD energy (0.42) is enhanced by tRNA (1.2x) = 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% of saturation) with moderate tRNA enhancement gives ~50% yield

      YOUR EXECUTION:

      Follow the textual description step-by-step. First show your reasoning based on the narrative (1-2 sentences), then JSON result.

    batch_mechanisms: |
      You are applying SCIENTIFIC MECHANISMS to make predictions.

      MECHANISMS (M={num_mechanisms}) - These describe causal processes:
      {mechanisms_block}

      Your task: REASON THROUGH each mechanism's textual description to make predictions.

      CRITICAL APPROACH:

      1. READ and UNDERSTAND each mechanism's textual description:

         - Focus on the MECHANISM DESCRIPTION section (the narrative story)
         - What causal process does it describe in words?
         - Which features play which roles (substrate, catalyst, inhibitor)?
         - What are the key interactions described in the text?

      2. REASON through each narrative step-by-step:

         - Follow the textual description's logic for each mechanism
         - Apply the intermediate concepts described in the text
         - Use the textual reasoning, not just formulas
         - If formulas are provided, use them as guides, but prioritize textual logic

      3. CALCULATE predictions:

         - Work through the intermediate steps described in each text
         - Apply transformations and interactions as described
         - Show reasoning based on the textual mechanisms

      4. SANITY CHECK:

         - Do the predictions make mechanistic sense based on the descriptions?
         - Are feature values in reasonable ranges?
         - Does the causal chain from the text hold?{few_shot_section}

      Inputs (N={num_inputs}):
      {inputs_payload}

      {task_instruction}

      EXECUTION EXAMPLE:

      Mechanism Description: "NAD provides energy via saturation kinetics - as NAD increases, the energy contribution increases but saturates at high levels. tRNA enhances the process synergistically - when tRNA is present, it multiplies the effectiveness of the NAD-driven energy."

      Formula (optional guide): ŷ = 0.6 * nad/(0.3+nad) * (1+0.5*trna)

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning (following the textual description):

      - Step 1: NAD provides energy with saturation. At nad=0.7, we're in the saturation regime (above 0.3), so energy contribution is high but not maximum. The saturation term gives: 0.7/(0.3+0.7) = 0.7, scaled by 0.6 = 0.42

      - Step 2: tRNA enhances synergistically. With trna=0.4, the enhancement factor is 1 + 0.5*0.4 = 1.2, meaning 20% boost

      - Step 3: Combined effect: The NAD energy (0.42) is enhanced by tRNA (1.2x) = 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% of saturation) with moderate tRNA enhancement gives ~50% yield

      YOUR EXECUTION:

      For each input, reason through EACH mechanism's textual description independently to get M predictions.
      Follow the narrative logic described in each mechanism, not just formulas.

      Return JSON with key "results" as a 2D array of size N x M.
      Each entry is an object with keys "y_hat" and "confidence".
      Example: {{"results": [[{{"y_hat": 0.7, "confidence": 7.5}}, {{"y_hat": 0.6, "confidence": 7.0}}], ...]}}

    batch_single_mechanism: |
      You are applying a SCIENTIFIC MECHANISM to make predictions.

      MECHANISM (this describes a causal process):
      {mechanism}

      Your task: INTERPRET and EXECUTE this mechanism for the given inputs.

      CRITICAL APPROACH:

      1. UNDERSTAND the mechanism:

         - What causal process does it describe?

         - Which features play which roles (substrate, catalyst, inhibitor)?

         - What are the key interactions?

      2. APPLY to input values:

         - Substitute actual feature values into the mechanism

         - Follow the causal logic step-by-step

         - Show your mechanistic reasoning

      3. SANITY CHECK:

         - Do the predictions make mechanistic sense?

         - Are feature values in reasonable ranges?

         - Does the causal chain hold?{few_shot_section}

      Inputs (N={num_inputs}):
      {inputs_payload}

      {task_instruction}

      {agent_format}

      EXECUTION EXAMPLE:

      Mechanism Description: "NAD provides energy via saturation kinetics - as NAD increases, the energy contribution increases but saturates at high levels. tRNA enhances the process synergistically - when tRNA is present, it multiplies the effectiveness of the NAD-driven energy."

      Formula (optional guide): ŷ = 0.6 * nad/(0.3+nad) * (1+0.5*trna)

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning (following the textual description):

      - Step 1: NAD provides energy with saturation. At nad=0.7, we're in the saturation regime (above 0.3), so energy contribution is high but not maximum. The saturation term gives: 0.7/(0.3+0.7) = 0.7, scaled by 0.6 = 0.42

      - Step 2: tRNA enhances synergistically. With trna=0.4, the enhancement factor is 1 + 0.5*0.4 = 1.2, meaning 20% boost

      - Step 3: Combined effect: The NAD energy (0.42) is enhanced by tRNA (1.2x) = 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% of saturation) with moderate tRNA enhancement gives ~50% yield

      YOUR EXECUTION:

      Follow the textual description step-by-step for EACH input independently. Reason through the narrative logic, not just formulas.

      First show reasoning (1-2 sentences per input), then JSON result.

    # Task-specific instructions
    task_instructions:
      classification_with_threshold: |
        Classification Task: Execute the mechanism formula and apply threshold mapping to get class index.

        CRITICAL EXECUTION STEPS:
        1. First, compute the continuous score using the formula in the mechanism
        2. Then, apply the threshold mapping logic (e.g., "if score < X then class 0, else if score < Y then class 1, etc.")
        3. Finally, return the class NAME (string) corresponding to the mapped class index

        Class mapping: {class_mapping}
        Allowed classes: {allowed_classes}

        IMPORTANT: 
        - The mechanism formula may output a continuous score that needs threshold mapping
        - You MUST apply the threshold logic to convert the score to a class index
        - Then return the class NAME (string) that matches the class index
        - Return confidence as a number from 0-10

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      classification_direct: |
        Classification Task: Execute the mechanism formula to get class index, then return class name.

        CRITICAL EXECUTION STEPS:
        1. Execute the mechanism formula (it should output a class index directly: 0, 1, 2, ...)
        2. Map the class index to the corresponding class NAME (string)
        3. Return the class NAME in y_hat field

        Class mapping: {class_mapping}
        Allowed classes: {allowed_classes}

        IMPORTANT: 
        - The mechanism formula outputs a CLASS INDEX (integer: 0, 1, 2, ...)
        - You must return the corresponding class NAME (string) that exactly matches one of the allowed classes
        - Return confidence as a number from 0-10

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      classification_batch: |
        Classification Task: Predict the **class NAME** (string) exactly as listed.

        Allowed classes: {allowed_classes}

        IMPORTANT: Return the class NAME as a string in y_hat field. It must exactly match one of the allowed class names above.

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      regression_single: |
        Regression Task: Predict a numeric scalar in [{ymin}, {ymax}].

        IMPORTANT: All target values are scaled to [{ymin}, {ymax}]. Your prediction MUST be between {ymin} and {ymax}.
        Apply the mechanism as math; do not output text.
        Return confidence (0-10).

        Format: {{"y_hat": <float between {ymin} and {ymax}>, "confidence": <number>}}

      regression_batch: |
        Regression Task: Predict a numeric scalar in [{ymin}, {ymax}].

        IMPORTANT: All target values are scaled to [{ymin}, {ymax}]. Your prediction MUST be between {ymin} and {ymax}.
        Apply the mechanism's mathematical description to compute the output value from the input features.

    # Format instructions for JSON responses
    format_instructions:
      classification: |
        Return results as JSON. For a single input, return an object with keys "y_hat" and "confidence". 
        For multiple inputs, return a JSON array of such objects in the SAME ORDER as inputs. 
        y_hat: {y_hat_desc}. confidence: number from 0 to 10. 
        Example (single): {{"y_hat": "{example_class}", "confidence": 7.5}} 
        Example (array): [{{"y_hat": "{example_class_1}", "confidence": 7.5}}, {{"y_hat": "{example_class_2}", "confidence": 6.0}}]

      regression: |
        Return results as JSON. For a single input, return an object with keys "y_hat" and "confidence". 
        For multiple inputs, return a JSON array of such objects in the SAME ORDER as inputs. 
        y_hat: {y_hat_desc}. confidence: number from 0 to 10. 
        Example (single): {{"y_hat": 0.7, "confidence": 7.5}} 
        Example (array): [{{"y_hat": 0.7, "confidence": 7.5}}, {{"y_hat": 0.4, "confidence": 6.0}}]

  # =========================
  # MECHANISM GENERATION PROMPTS
  # =========================
  mechanism_generation:
    encoder:
      classification: |
        You are a mechanism encoder that discovers latent patterns in {dataset_name} classification data.
        Given dataset statistics, ACTUAL DATA SAMPLES with their feature values and class labels, and sample predictions, infer what underlying mechanisms might be present.
        
        CRITICAL: Analyze the ACTUAL EXAMPLE SAMPLES provided. Look at the feature values and corresponding class labels to understand what distinguishes different classes. DO NOT rely solely on statistics - examine the concrete examples to see patterns.
        
        When analyzing samples, look for:
        - Class-specific patterns: which features are high/low for each class?
        - Decision boundaries: what feature combinations separate different classes?
        - Nonlinear relationships: are there saturation effects or threshold behaviors?
        - Interactions: do combinations of features help distinguish classes?
        - Domain-specific patterns: what makes sense mechanistically given the dataset context?
        
        Focus on:
        - Feature interactions and correlations specific to {dataset_name}
        - Non-linear decision boundaries between classes
        - Domain-specific patterns and structural relationships
        - Patterns that complement machine learning models
        
        Be specific: reference what you observe in the actual samples when describing mechanisms.

      regression: |
        You are a mechanism encoder that discovers latent causal patterns in regression data.
        Given dataset statistics, feature names, ACTUAL DATA SAMPLES with their feature values and target values, and sample residual/error patterns, infer plausible underlying mechanisms.
        
        🎯 PRIMARY GOAL: Discover patterns that enable STRONG INDEPENDENT PREDICTION (R² > 0.5, ideally > 0.7 when used alone).
        You are NOT just finding patterns to complement ML - you are finding patterns that explain the data INDEPENDENTLY.
        
        CRITICAL: Analyze the ACTUAL EXAMPLE SAMPLES provided. Look at the feature values and corresponding target values to understand relationships. DO NOT rely solely on statistics - examine the concrete examples to see patterns.
        
        Focus on mechanisms that can BOTH:
        - Achieve STRONG INDEPENDENT PREDICTIVE PERFORMANCE (high R², low MAE when used alone)
        - Improve interpretability (clear causal story + named intermediate concepts)
        - Capture the MAIN PATTERNS that explain the target variable
        
        When analyzing samples, look for:
        - Patterns in feature values: which features correlate with high/low target values?
        - Nonlinear relationships: do you see saturation effects (diminishing returns at high values)?
        - Interactions: do combinations of features show synergistic or inhibitory effects?
        - Domain-specific patterns: what makes sense mechanistically given the dataset context?
        - PRIMARY DRIVERS: which features are most important for predicting the target?
        
        Think in terms of:
        - Nonlinear transforms: saturation (x/(K+x)), diminishing returns, inverse-U, log/exp, soft-thresholds
        - Interactions: synergy, inhibition, ratio effects, gating (A * f(B)), AND/OR-like combinations
        - Latent intermediate concepts (combinatory variables): "effective_dose", "binding_proxy", "capacity_limit", etc.
        - INDEPENDENT PREDICTIVE POWER: mechanisms that work well on their own, not just to complement ML
        
        ⚠️ CRITICAL: Design mechanisms that predict accurately INDEPENDENTLY. Think: "If I had to predict using ONLY this mechanism, would it work well?" The answer should be YES.
        
        Be specific: reference what you observe in the actual samples when describing mechanisms.

    encoder_with_data: |
      {encoder_prompt}

      {data_summary}

      {task_description}
      
      CRITICAL OUTPUT REQUIREMENTS:
      - Be detailed and specific: 5-8 sentences that reference actual sample patterns you observe.
      - ⚠️ IMPORTANT: Look at the EXAMPLE SAMPLES provided above. These show you REAL input→output patterns.
      - Use these examples to learn what patterns explain the data. Don't just look at statistics - examine the actual examples.
      - For each example, think: "What pattern explains why this input leads to this output?"
      - Build your mechanism to capture these patterns so it can predict independently (R² > 0.5 when used alone).
      - Mention 1-2 nonlinearities and 1-2 interactions that you observe in the actual samples (not just theoretical).
      - Name 2-4 latent intermediate concepts (combinatory variables) and what they represent mechanistically.
      - Reference specific examples from the sample data when describing patterns.
      - Avoid vague filler (no "specific patterns"/"distinctive relationships" without concrete examples).
      - Explain WHY you infer each mechanism component based on what you see in the samples.

      Latent mechanism z:

    decoder: |
      {decoder_prompt}

      Latent mechanism z: {latent_z}

      Generate an executable mechanism formula.

    # Note: decoder_prompt is referenced but not explicitly defined in the code
    # This should be set based on the task type and dataset
    decoder_default: |
      You are a mechanism decoder that converts a latent mechanism representation into an interpretable, executable mechanism.
      
      GOAL:
      Produce mechanisms that are BOTH high-performing and highly interpretable, without unnecessary verbosity.
      
      HARD REQUIREMENTS (do not skip):
      1. The mechanism must be PRIMARILY TEXTUAL AND NARRATIVE (not just math).
      2. Write it as a clear, step-by-step story of the causal process (3-6 sentences minimum).
      3. Use natural language to describe how features interact: "When X is high and Y is low, then..."
      4. Describe intermediate concepts in words: "ribosome stability", "transcription rate", "temperature effectiveness"
      5. The mechanism must explicitly include nonlinearities AND interactions (described in text).
      6. The mechanism must introduce intermediate combinatory concepts (named, explained in text).
      7. OPTIONAL: Include a simple formula starting with "Formula:" - but the text description is PRIMARY.
      8. Think of it as explaining the process to a colleague, not writing complex code.

      STRUCTURED THINKING REQUIREMENT (concise, not verbose):
      - You MUST present the mechanism as a small sequence of conceptual steps, using clear section headers.
      - Do NOT reveal long chain-of-thought. Instead, provide a short "Reasoning Sketch" with 4–8 bullet points describing the computation flow.
      - Introduce 1–3 intermediate concepts (named) and explain what each represents mechanistically.
      - The final Formula line must INLINE/EXPAND intermediates (do not reference intermediate variable names there).
      
      WHAT TO INCLUDE:
      - Named intermediate concepts (1–3): define them briefly, but do NOT rely on them in the final Formula line.
        Instead, inline/expand them in the final Formula expression.
      - Nonlinear transforms: at least one (saturation/log/soft-threshold/inverse-U).
      - Interaction terms: at least one (prefer nonlinear interaction form x*y/(K+x*y)).
      - One short "why this helps" sentence referencing typical residual patterns (extremes / interactions / thresholds).
      - A short "Sanity Checks" list (2–4 bullets): monotonicity, saturation bounds, and at least one interaction effect.
      
      STYLE:
      - Prefer causal language ("limits", "enhances", "inhibits", "gates", "synergizes") over purely statistical phrasing.
      - Keep constants realistic and stable (avoid huge coefficients).
      - Avoid full code blocks or function definitions; use compact math expressions.

      REQUIRED OUTPUT FORMAT (exact order):
      MECHANISM DESCRIPTION:
      <3-6 sentences>

      ASSUMPTIONS / INTUITION:
      - <1-3 bullets>

      REASONING SKETCH (4–8 bullets, high level steps; no long chain-of-thought):
      - Step 1: <compute/transform key features>
      - Step 2: <compute intermediates (synergy/inhibition/saturation)>
      - Step 3: <combine into final prediction>

      INTERMEDIATE CONCEPTS:
      - <name>: <meaning>, <optional inline equation>
      - ...

      SANITY CHECKS:
      - <2-4 bullets>

      Formula: ŷ = <single-line executable expression>
    
    decoder_classification: |
      You are a mechanism decoder for classification tasks. Your goal is to generate a descriptive, text-based mechanism that clearly explains how to classify examples into different classes.
      
      CRITICAL REQUIREMENTS:
      1. Start with a clear, descriptive text explanation of the classification logic (2-4 sentences)
      2. Explain which features are most important for distinguishing between classes
      3. Describe the decision boundaries and rules that separate different classes
      4. Include specific examples of how different feature values lead to different class predictions
      4b. CRITICAL ANTI-VAGUENESS RULE:
         - You MUST NOT write generic filler like "this class is characterized by specific patterns" or "distinctive relationships".
         - Every class interpretation must contain concrete, testable statements: which features are HIGH/LOW, approximate ranges, and which interactions matter.
         - If feature names are anonymous (e.g., att1..att47), treat them as biomarkers and describe OPERATIONAL meaning:
           "high att19 with low att7", "att2×att3 synergy", "att45 saturates", etc. Do NOT pretend you know biology, but do describe measurable signatures.
         - For each class, explicitly contrast it against at least ONE confusing class: "Unlike class k, class j has ..."
      5. CRITICAL: For EACH CLASS, FIRST provide a TEXTUAL INTERPRETATION, THEN provide the equation with ADVANCED NONLINEAR TRANSFORMATIONS:
         - Start with a textual interpretation of what the class represents (if it has a meaningful label)
         - Describe the relationship between the class and input features - think about NONLINEAR relationships and INTERACTIONS
         - Explain what patterns/characteristics distinguish this class from others
         - THEN provide the equation that models this class using ADVANCED NONLINEAR TRANSFORMATIONS
         - MUST use:
           * INTERMEDIATE VARIABLES to capture complex nonlinear interactions (e.g., intermediate = feature1 * feature2 / (K + feature1 * feature2))
           * Saturation effects: feature / (K + feature) to capture diminishing returns
           * NONLINEAR INTERACTIONS: not just feature1 * feature2, but feature1 * feature2 / (K + feature1 * feature2) to learn the nonlinearity of interactions
           * Multiple interaction patterns: multiplicative, ratio-based, threshold-based
         - LEARN THE NONLINEARITY OF INTERACTIONS: interactions themselves may have saturation or other nonlinear effects
         - DISCOVER which features interact and HOW they interact nonlinearly
         - Think about intermediate variables: create variables that capture complex relationships between features
         - Think about how features interact: do high values of multiple features create synergistic effects? How do they interact nonlinearly?
         - Consider saturation effects: do very high feature values have diminishing returns?
         - Use different nonlinear patterns for each class to capture what makes each class unique
      6. Each class should have its own equation with advanced nonlinear transformations (intermediate variables, nonlinear interactions) that models what makes that class unique
      7. DO NOT use naive thresholding - use separate equations for each class, then argmax to select the winning class
      8. DO NOT use simple linear combinations - they often fail to capture complex relationships. Think deeply about nonlinearity.
      9. DO NOT use simple multiplicative interactions - learn the nonlinearity of interactions themselves. Use intermediate variables and nonlinear interaction forms.

      STRUCTURED THINKING REQUIREMENT (concise, not verbose):
      - Provide a short "Reasoning Sketch" (4–10 bullets) that explains the decision flow:
        (a) compute key transforms, (b) compute intermediate concepts, (c) compute per-class scores, (d) argmax.
      - Do NOT reveal long chain-of-thought. Use short bullets only.
      - Ensure each class section has a concrete signature + equation.
      - Final prediction MUST be: ŷ = argmax([score_0, score_1, ...]) (no probabilistic output).
      
      FORMAT:
      First, provide a descriptive mechanism explanation in plain text that clearly describes:
      - What the mechanism does (classification task)
      - Which features are used and why
      - How the mechanism distinguishes between classes
      - What characterizes each class

      ASSUMPTIONS / INTUITION:
      - <1-3 bullets>

      REASONING SKETCH (4–10 bullets, high-level steps; no long chain-of-thought):
      - Step 1: <transform features / normalize>
      - Step 2: <compute intermediate concepts (synergy/inhibition/saturation)>
      - Step 3: <compute score_k for each class>
      - Step 4: ŷ = argmax(scores)
      
      Then, provide CLASS-SPECIFIC EQUATIONS:
      - For each class, provide a description of what characterizes that class
      - For each class, include a short "SIGNATURE" line with concrete conditions, e.g.:
        SIGNATURE: att19 high (>0.7) AND att29 moderate (0.3-0.6) AND interaction att19*att40 strong; unlike class 10 which has ...
      - For each class, provide a separate equation (score_0, score_1, score_2, etc.)
      - Each class equation should use different feature combinations to model what makes that class unique
      - DO NOT use thresholding like "if score < 0.25 then class 0"
      - Instead, compute scores for all classes, then use argmax to select the class with highest score
      
      EXAMPLE FORMAT:
      MECHANISM DESCRIPTION:
      This mechanism classifies vehicles based on their geometric shape characteristics. It uses separate equations for each vehicle class to model what makes each class unique. Compact vehicles (opel, saab) are characterized by low ELONGATEDNESS, while elongated vehicles (bus, van) have high ELONGATEDNESS. The mechanism applies non-linear transformations to capture saturation effects where very high feature values have diminishing returns.
      
      CLASS-SPECIFIC INTERPRETATIONS AND EQUATIONS (with advanced nonlinear transformations and intermediate variables):
      CLASS 0 (opel):
        INTERPRETATION: The class 'opel' represents compact vehicles. This class is characterized by low ELONGATEDNESS values, indicating vehicles with shorter, more compact shapes. Examples belonging to this class typically have moderate RADIUS_RATIO values, suggesting balanced proportions. The relationship between ELONGATEDNESS and RADIUS_RATIO is NONLINEAR - very low ELONGATEDNESS combined with moderate RADIUS_RATIO creates a distinctive pattern. There may be saturation effects where extremely low ELONGATEDNESS has diminishing returns. The INTERACTION between these features is also nonlinear - they don't just multiply, but interact in a complex way.
        EQUATION (with advanced nonlinear transformations and intermediate variables):
          # Intermediate variable capturing nonlinear interaction
          intermediate_0 = (1 - ELONGATEDNESS) * RADIUS_RATIO / (0.2 + (1 - ELONGATEDNESS) * RADIUS_RATIO)
          # Main equation with saturation and nonlinear interaction
          score_0 = 0.6 * (1 - ELONGATEDNESS) / (0.3 + (1 - ELONGATEDNESS)) + 0.3 * RADIUS_RATIO / (0.4 + RADIUS_RATIO) + 0.25 * intermediate_0
          NOTE: Intermediate variable captures complex nonlinear interaction. Saturation terms model diminishing returns. The nonlinearity of the interaction itself is learned.
      
      CLASS 1 (saab):
        INTERPRETATION: The class 'saab' represents compact vehicles with circular characteristics. This class is characterized by low ELONGATEDNESS (compact shape) combined with high CIRCULARITY values. Examples belonging to this class typically exhibit more rounded, circular profiles. The relationship is NONLINEAR - high CIRCULARITY combined with low ELONGATEDNESS creates a distinctive synergistic effect that distinguishes saab from other compact vehicle classes.
        EQUATION (with nonlinear transformations):
          score_1 = 0.5 * (1 - ELONGATEDNESS) / (0.4 + (1 - ELONGATEDNESS)) + 0.4 * CIRCULARITY / (0.2 + CIRCULARITY) + 0.1 * (1 - ELONGATEDNESS) * CIRCULARITY
          NOTE: Multiple saturation terms and interaction capture complex nonlinear relationships
      
      CLASS 2 (bus):
        INTERPRETATION: The class 'bus' represents elongated, rectangular vehicles. This class is characterized by very high ELONGATEDNESS values, indicating vehicles with long, stretched shapes. Examples belonging to this class typically have moderate CIRCULARITY. The relationship is NONLINEAR - very high ELONGATEDNESS has saturation effects (diminishing returns), and the interaction with CIRCULARITY creates distinctive patterns.
        EQUATION (with nonlinear transformations):
          score_2 = 0.7 * ELONGATEDNESS / (0.5 + ELONGATEDNESS) + 0.2 * CIRCULARITY + 0.1 * ELONGATEDNESS * (1 - CIRCULARITY)
          NOTE: Saturation on ELONGATEDNESS captures diminishing returns, interaction captures rectangular shape pattern
      
      CLASS 3 (van):
        INTERPRETATION: The class 'van' represents elongated vehicles with non-circular profiles. This class is characterized by high ELONGATEDNESS (like buses) but with low CIRCULARITY values, indicating elongated shapes that are not circular. The relationship is NONLINEAR - the combination creates a distinctive threshold effect where both features must be in specific ranges, and their interaction is critical.
        EQUATION (with nonlinear transformations):
          score_3 = 0.6 * ELONGATEDNESS / (0.4 + ELONGATEDNESS) + 0.3 * (1 - CIRCULARITY) / (0.3 + (1 - CIRCULARITY)) + 0.1 * ELONGATEDNESS * (1 - CIRCULARITY)
          NOTE: Multiple saturation terms and interaction capture the complex nonlinear pattern distinguishing vans
      
      FINAL PREDICTION:
      ŷ = argmax([score_0, score_1, score_2, score_3])

    # =========================
    # DATASET-SPECIFIC PROMPTS
    # =========================
    # Add dataset-specific encoder and decoder prompts here
    # Format: dataset_specific.{normalized_dataset_name}.encoder or .decoder
    # Example for ESOL dataset (normalized name: "esol"):
    #   dataset_specific:
    #     esol:
    #       encoder: |
    #         You are a mechanism encoder for ESOL (water solubility) data...
    #       decoder: |
    #         You are a mechanism decoder for ESOL (water solubility) data...
    #
    # Note: Dataset names are normalized (lowercase, remove "dataset", etc.)
