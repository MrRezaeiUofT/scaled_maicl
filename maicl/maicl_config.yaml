    dataset_specific:
      lymphography:
        classification:
          encoder: |
            You are a mechanism encoder for the OpenML LYMPHOGRAPHY dataset (4-way classification).

            TASK:
            Infer a *compact latent mechanism* that separates 4 diagnosis classes.

