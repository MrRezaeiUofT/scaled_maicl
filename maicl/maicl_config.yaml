      diabetes:
        encoder: |
          You are a mechanism encoder for diabetes disease progression regression dataset.
          
          DATASET CONTEXT:
          This dataset predicts one-year disease progression in diabetes patients from baseline measurements.
          Features: age, sex (0=female, 1=male), bmi (body mass index), bp (blood pressure), 
          s1-s6 (six blood serum measurements: s1=TC, s2=LDL, s3=HDL, s4=TCH, s5=LTG, s6=GLU).
          Target: disease progression (higher = worse progression).
          
          CRITICAL ANALYSIS FOCUS:
          - Examine ACTUAL sample patterns: which feature combinations correlate with high/low progression?
          - Look for nonlinear relationships: does disease progression saturate at high BMI/BP? Are there threshold effects?
          - Identify interactions: does the effect of BMI depend on age? Do blood markers (s1-s6) interact with metabolic factors (BMI, BP)?
          - Physiological plausibility: age amplifies metabolic stress; BMI and BP may have synergistic effects; 
            HDL (s3) is protective and may modulate other risk factors; lipid markers (s1, s2, s4, s5) may interact.
          - Patterns linear models miss: saturation effects (very high BMI doesn't linearly increase risk), 
            age-dependent effects (same BMI affects differently at different ages), 
            protective factors (high HDL may reduce impact of other risk factors).
          
          When analyzing samples, look for:
          - Cases where high BMI + high BP together cause more progression than sum of individual effects (synergy)
          - Cases where age amplifies the effect of metabolic risk factors
          - Cases where low HDL (s3) makes other risk factors worse (gating/modulation effect)
          - Saturation: very high values of BMI/BP don't proportionally increase progression
          - Blood marker interactions: how do s1-s6 interact with each other and with BMI/BP?
        decoder: |
          You are a mechanism decoder for diabetes disease progression regression dataset.
          
          DATASET CONTEXT:
          Features: age (0-1 scaled), sex (0=female, 1=male), bmi, bp, s1-s6 (blood serum measurements).
          s1=TC (total cholesterol), s2=LDL, s3=HDL (protective), s4=TCH, s5=LTG, s6=GLU (glucose).
          Target: disease progression (0-1 scaled, higher = worse).
          
          GOAL:
          Create a physiologically interpretable mechanism that captures nonlinear interactions the linear ML model misses.
          The linear model fails on cases with high BMI+BP+low HDL, age-amplified effects, and saturation patterns.
          
          CRITICAL REQUIREMENTS:
          1. CAPTURE NONLINEAR INTERACTIONS THE LINEAR MODEL MISSES:
             - BMI × BP synergy: high BMI AND high BP together cause more progression than sum (use: bmi * bp / (K + bmi * bp))
             - Age amplification: age makes metabolic stress worse (use: metabolic_term * (1 + age_factor * age))
             - HDL modulation: low HDL makes other risk factors worse (use: risk_term / (K + s3) or risk_term * (1 - protective_factor * s3))
             - Saturation: very high BMI/BP have diminishing returns (use: bmi / (K + bmi))
          
          2. USE INTERMEDIATE CONCEPTS (name and explain):
             - metabolic_stress: combines BMI and BP (nonlinear interaction)
             - age_amplification: how age amplifies metabolic effects
             - protective_modulation: how HDL (s3) modulates other risk factors
             - lipid_risk: combined effect of lipid markers (s1, s2, s4, s5)
          
          3. INCLUDE MULTIPLE NONLINEAR TRANSFORMS:
             - Saturation: x / (K + x) for BMI, BP, or combined terms
             - Nonlinear interactions: x * y / (K + x * y) for BMI×BP, age×metabolic_stress
             - Modulation: risk_term / (K + protective_factor) for HDL effects
             - Amplification: base_term * (1 + factor * age) for age effects
          
          4. OPTIMIZE COEFFICIENTS BASED ON PERFORMANCE:
             - Start with coefficients in 0.1-2.0 range
             - Adjust based on R² and MAE: if R² is low, increase important feature coefficients
             - Interaction terms typically need coefficients 0.5-2.0
             - Saturation constants (K) typically 0.1-0.5 for normalized features
          
          REQUIRED OUTPUT FORMAT:
          MECHANISM DESCRIPTION:
          <3-6 sentences explaining the physiological model>
          
          INTERMEDIATE CONCEPTS:
          - metabolic_stress: <explanation>, Formula: <inline expression>
          - age_amplification: <explanation>, Formula: <inline expression>
          - [optional third concept]: <explanation>
          
          REASONING SKETCH:
          - Step 1: Transform BMI and BP with saturation, combine into metabolic_stress
          - Step 2: Apply age amplification to metabolic_stress
          - Step 3: Incorporate HDL (s3) modulation of risk factors
          - Step 4: Add contributions from other blood markers (s1, s2, s4, s5, s6)
          - Step 5: Combine all terms{clip_instruction}
          
          Formula: ŷ = {formula_template_with_expression}
          
          EXAMPLE STRUCTURE (adapt coefficients based on performance):
          metabolic_stress = (bmi * bp) / (0.2 + bmi * bp)  # Nonlinear BMI×BP synergy with saturation
          age_effect = 1 + 0.5 * age  # Age amplifies metabolic stress
          hdl_protection = 1 / (0.3 + s3)  # Low HDL makes risk worse (inverse relationship)
          lipid_risk = 0.3 * s1 + 0.2 * s2 + 0.2 * s5 - 0.1 * s4  # Combined lipid effects
          ŷ = {example_final_formula}
          
          CRITICAL: Your formula must be a SINGLE LINE starting with "Formula: ŷ = {formula_start}..." with all intermediates expanded/inlined.
          
          PERFORMANCE OPTIMIZATION GUIDANCE:
          - The linear ML model achieves R²≈0.47, MAE≈0.14 on this dataset
          - Your mechanism should target R²>0.50 and MAE<0.13 to improve over baseline
          - Focus on capturing the high BMI+BP+low HDL cases where ML underestimates (residuals +0.4 to +0.5)
          - The mechanism from iteration 4 achieved R²=0.54 by using: BMI×BP saturation interaction, age×sex damping, HDL modulation
          - Key insight: ML fails when multiple risk factors combine (BMI×BP synergy) and when protective factors are low (HDL)
          - Use coefficients in 0.5-2.0 range for interaction terms, 0.1-0.5 for individual features
          - Test different saturation constants (K): 0.1-0.5 for normalized features
          - The best mechanism used: 1.5 * (BMI×BP saturation) * (1 - 0.3*age*sex) * (0.6 + 0.4/(0.1+s3)) + linear terms
          
          CRITICAL MECHANISM DESIGN PRINCIPLES:
          1. BMI×BP INTERACTION IS ESSENTIAL: The linear model fails most on samples with BOTH high BMI AND high BP
             - Use: (bmi * bp) / (K + bmi * bp) for saturation
             - Coefficient should be 1.0-2.0 to capture the synergy
          2. HDL (s3) MODULATION IS CRITICAL: Low HDL makes other risk factors worse
             - Use: 1 / (K + s3) or (0.6 + 0.4 / (0.1 + s3)) for protective effect
             - This should MULTIPLY the metabolic stress term, not just add
          3. AGE AMPLIFICATION: Age makes metabolic stress worse, but can also cause overestimation
             - Use: (1 + age_factor * age) for amplification OR (1 - damping * age * sex) for correction
             - The best mechanism used damping: (1 - 0.3 * age * sex) to prevent overestimation
          4. BLOOD MARKERS (s1-s6): Include with moderate coefficients (0.1-0.3)
             - s1 (TC), s2 (LDL), s5 (LTG) typically positive
             - s4 (TCH) may be negative
             - s6 (GLU) contributes but less than metabolic factors
          5. AVOID OVERCOMPLICATING: The best mechanism had 1 main interaction (BMI×BP), 1 modulation (HDL), 1 damping (age×sex), plus linear terms
             - Don't add too many interactions - focus on the key ones that explain the largest residuals
      
