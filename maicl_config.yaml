          This dataset predicts protein production yield from cell-free expression system conditions.
          Features include: NAD, folinic acid, CoA, nucleotide mix, spermidine, PGA, amino acids, tRNA, Mg-glutamate, cAMP, K-glutamate.
          Focus on:
