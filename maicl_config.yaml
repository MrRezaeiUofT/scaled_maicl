# MA-ICL Configuration
# This file contains all prompts and templates used by the MA-ICL system

prompts:
  # =========================
  # ATTENTION PROMPTS
  # =========================
  attention:
    compute_weights: |
      Compute attention weights for mechanism aggregation.
      Consider: prediction confidence, mechanism relevance to input, consistency with other predictions.

  # =========================
  # PREDICTION PROMPTS
  # =========================
  prediction:
    single_mechanism: |
      You are applying a SCIENTIFIC MECHANISM to make a prediction.

      MECHANISM (HIERARCHICAL CAUSAL GRAPH + FORMULA):
      {mechanism}

      Your task: INTERPRET the Causal Graph and EXECUTE the Formula for the given input.

      CRITICAL APPROACH:

      1. UNDERSTAND the Causal Graph:

         - What causal process does it describe?

         - Which features play which roles (substrate, catalyst, inhibitor)?

         - What are the key interactions defined in the EDGES section?

         - Follow the EXECUTION FLOW defined in the graph.

      2. APPLY to input values:

         - Substitute actual feature values into the mechanism

         - Follow the causal logic step-by-step

         - Show your mechanistic reasoning

      3. SANITY CHECK:

         - Does the prediction make mechanistic sense?

         - Are feature values in reasonable ranges?

         - Does the causal chain hold?{few_shot_section}

      Input features:

      {input_features}

      {task_instruction}

      {agent_format}

      EXECUTION EXAMPLE:

      Mechanism: 
      "# HIERARCHICAL CAUSAL GRAPH
      ## NODES
      - NAD: Energy source (Saturation)
      - tRNA: Enhancer (Synergy)
      
      ## EDGES
      - NAD -> Yield: Saturation kinetics
      - tRNA -> Yield: Linear enhancement
      
      ## EXECUTION FLOW
      1. Calculate NAD saturation.
      2. Multiply by tRNA factor.
      
      EXECUTABLE FORMULA:
      ```python
      y = 0.6 * nad/(0.3+nad) * (1+0.5*trna)
      ```"

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning:

      - NAD saturation term: 0.6 * 0.7/(0.3+0.7) = 0.6 * 0.7 = 0.42

      - tRNA enhancement: 1 + 0.5*0.4 = 1.2

      - Combined: 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% saturation) with moderate tRNA gives ~50% yield

      YOUR EXECUTION:

      First show reasoning (1-2 sentences), then JSON result.

    batch_mechanisms: |
      You are applying SCIENTIFIC MECHANISMS to make predictions.

      MECHANISMS (M={num_mechanisms}) - These contain HIERARCHICAL CAUSAL GRAPHS and Formulas:
      {mechanisms_block}

      Your task: INTERPRET and EXECUTE each mechanism for the given inputs.

      CRITICAL APPROACH:

      1. UNDERSTAND each Causal Graph:

         - What causal process does it describe?

         - Which features play which roles (substrate, catalyst, inhibitor)?

         - What are the key interactions?

      2. APPLY to input values:

         - Substitute actual feature values into each mechanism

         - Follow the causal logic step-by-step

         - Show your mechanistic reasoning

      3. SANITY CHECK:

         - Do the predictions make mechanistic sense?

         - Are feature values in reasonable ranges?

         - Does the causal chain hold?{few_shot_section}

      Inputs (N={num_inputs}):
      {inputs_payload}

      {task_instruction}

      EXECUTION EXAMPLE:

      Mechanism: 
      "# HIERARCHICAL CAUSAL GRAPH
      ## NODES
      - NAD: Energy source (Saturation)
      - tRNA: Enhancer (Synergy)
      
      ## EXECUTION FLOW
      1. Calculate NAD saturation.
      2. Multiply by tRNA factor.
      
      EXECUTABLE FORMULA:
      ```python
      y = 0.6 * nad/(0.3+nad) * (1+0.5*trna)
      ```"

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning:

      - NAD saturation term: 0.6 * 0.7/(0.3+0.7) = 0.6 * 0.7 = 0.42

      - tRNA enhancement: 1 + 0.5*0.4 = 1.2

      - Combined: 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% saturation) with moderate tRNA gives ~50% yield

      YOUR EXECUTION:

      For each input, apply EACH mechanism independently to get M predictions.

      Return JSON with key "results" as a 2D array of size N x M.
      Each entry is an object with keys "y_hat" and "confidence".
      Example: {{"results": [[{{"y_hat": 0.7, "confidence": 7.5}}, {{"y_hat": 0.6, "confidence": 7.0}}], ...]}}

    batch_single_mechanism: |
      You are applying a SCIENTIFIC MECHANISM to make predictions.

      MECHANISM (HIERARCHICAL CAUSAL GRAPH + FORMULA):
      {mechanism}

      Your task: INTERPRET the Causal Graph and EXECUTE the Formula for the given inputs.

      CRITICAL APPROACH:

      1. UNDERSTAND the Causal Graph:

         - What causal process does it describe?

         - Which features play which roles (substrate, catalyst, inhibitor)?

         - What are the key interactions?

      2. APPLY to input values:

         - Substitute actual feature values into the mechanism

         - Follow the causal logic step-by-step

         - Show your mechanistic reasoning

      3. SANITY CHECK:

         - Do the predictions make mechanistic sense?

         - Are feature values in reasonable ranges?

         - Does the causal chain hold?{few_shot_section}

      Inputs (N={num_inputs}):
      {inputs_payload}

      {task_instruction}

      {agent_format}

      EXECUTION EXAMPLE:

      Mechanism: 
      "# HIERARCHICAL CAUSAL GRAPH
      ## NODES
      - NAD: Energy source (Saturation)
      - tRNA: Enhancer (Synergy)
      
      ## EXECUTION FLOW
      1. Calculate NAD saturation.
      2. Multiply by tRNA factor.
      
      EXECUTABLE FORMULA:
      ```python
      y = 0.6 * nad/(0.3+nad) * (1+0.5*trna)
      ```"

      Input: {{"nad": 0.7, "trna": 0.4}}

      Reasoning:

      - NAD saturation term: 0.6 * 0.7/(0.3+0.7) = 0.6 * 0.7 = 0.42

      - tRNA enhancement: 1 + 0.5*0.4 = 1.2

      - Combined: 0.42 * 1.2 = 0.504

      - Interpretation: Moderate NAD (70% saturation) with moderate tRNA gives ~50% yield

      YOUR EXECUTION:

      Apply the mechanism to EACH input independently.

      First show reasoning (1-2 sentences per input), then JSON result.

    # Task-specific instructions
    task_instructions:
      classification_with_threshold: |
        Classification Task: Execute the mechanism formula and apply threshold mapping to get class index.

        CRITICAL EXECUTION STEPS:
        1. First, compute the continuous score using the formula in the mechanism
        2. Then, apply the threshold mapping logic (e.g., "if score < X then class 0, else if score < Y then class 1, etc.")
        3. Finally, return the class NAME (string) corresponding to the mapped class index

        Class mapping: {class_mapping}
        Allowed classes: {allowed_classes}

        IMPORTANT: 
        - The mechanism formula may output a continuous score that needs threshold mapping
        - You MUST apply the threshold logic to convert the score to a class index
        - Then return the class NAME (string) that matches the class index
        - Return confidence as a number from 0-10

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      classification_direct: |
        Classification Task: Execute the mechanism formula to get class index, then return class name.

        CRITICAL EXECUTION STEPS:
        1. Execute the mechanism formula (it should output a class index directly: 0, 1, 2, ...)
        2. Map the class index to the corresponding class NAME (string)
        3. Return the class NAME in y_hat field

        Class mapping: {class_mapping}
        Allowed classes: {allowed_classes}

        IMPORTANT: 
        - The mechanism formula outputs a CLASS INDEX (integer: 0, 1, 2, ...)
        - You must return the corresponding class NAME (string) that exactly matches one of the allowed classes
        - Return confidence as a number from 0-10

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      classification_batch: |
        Classification Task: Predict the **class NAME** (string) exactly as listed.

        Allowed classes: {allowed_classes}

        IMPORTANT: Return the class NAME as a string in y_hat field. It must exactly match one of the allowed class names above.

        Format: {{"y_hat": "<class_name>", "confidence": <number>}}

      regression_single: |
        Regression Task: Predict a numeric scalar in [{ymin}, {ymax}].

        IMPORTANT: 
        1. All target values are scaled to [{ymin}, {ymax}]. 
        2. Your formula must output values in this range.
        3. If your raw formula produces values > {ymax} or < {ymin}, check your coefficients.
        4. Return confidence (0-10).

        Format: {{"y_hat": <float between {ymin} and {ymax}>, "confidence": <number>}}

      regression_batch: |
        Regression Task: Predict a numeric scalar in [{ymin}, {ymax}].

        IMPORTANT: 
        1. All target values are scaled to [{ymin}, {ymax}]. 
        2. Your formula must output values in this range.
        3. Apply the mechanism's mathematical description exactly.

    # Format instructions for JSON responses
    format_instructions:
      classification: |
        Return results as JSON. For a single input, return an object with keys "y_hat" and "confidence". 
        For multiple inputs, return a JSON array of such objects in the SAME ORDER as inputs. 
        y_hat: {y_hat_desc}. confidence: number from 0 to 10. 
        Example (single): {{"y_hat": "{example_class}", "confidence": 7.5}} 
        Example (array): [{{"y_hat": "{example_class_1}", "confidence": 7.5}}, {{"y_hat": "{example_class_2}", "confidence": 6.0}}]

      regression: |
        Return results as JSON. For a single input, return an object with keys "y_hat" and "confidence". 
        For multiple inputs, return a JSON array of such objects in the SAME ORDER as inputs. 
        y_hat: {y_hat_desc}. confidence: number from 0 to 10. 
        Example (single): {{"y_hat": 0.7, "confidence": 7.5}} 
        Example (array): [{{"y_hat": 0.7, "confidence": 7.5}}, {{"y_hat": 0.4, "confidence": 6.0}}]

  # =========================
  # MECHANISM GENERATION PROMPTS
  # =========================
  mechanism_generation:
    encoder:
      classification: |
        You are a mechanism encoder that discovers latent patterns in {dataset_name} classification data.
        Given dataset statistics and sample predictions, infer what underlying mechanisms might be present.
        Focus on:
        - Feature interactions and correlations specific to {dataset_name}
        - Non-linear decision boundaries between classes
        - Domain-specific patterns and structural relationships
        - Patterns that complement machine learning models

      regression: |
        You are a mechanism encoder that discovers latent patterns in data.
        Given dataset statistics and sample predictions, infer what underlying mechanisms might be present.

    encoder_with_data: |
      {encoder_prompt}

      {data_summary}

      {task_description}
      Describe it in 2-3 sentences.

      Latent mechanism z:

    decoder: |
      {decoder_prompt}

      Latent mechanism z: {latent_z}

      Generate a CAUSAL GRAPH description followed by an EXECUTABLE FORMULA.

    # Note: decoder_prompt is referenced but not explicitly defined in the code
    # This should be set based on the task type and dataset
    decoder_default: |
      You are a mechanism decoder that converts latent representations into Causal Graphs and executable formulas.
      Generate a clear, interpretable Causal Graph that explains the underlying process, followed by a formula that implements it.

  # =========================
  # FEW-SHOT EXAMPLES
  # =========================
  few_shot:
    section_header: |
      
      FEW-SHOT EXAMPLES (learn from these input-output patterns):
      {few_shot_text}
      

# =========================
# TRAINING & ACCEPTANCE CONFIGURATION
# =========================
training:
  # Metric improvement thresholds for accepting updates
  metric_improvement:
    # Primary thresholds (strict) - used in PRIMARY acceptance check
    primary:
      regression:
        r2: 0.001  # Relaxed: Require at least 0.001 improvement
        mae: 0.001  # Relaxed: Require at least 0.001 improvement
      classification:
        acc: 0.001  # Relaxed: Require at least 0.1% improvement
        f1: 0.001  # Relaxed: Require at least 0.1% improvement
    
    # Secondary thresholds (lenient) - used in fallback acceptance checks
    secondary:
      regression:
        r2: 0.002  # Relaxed secondary
        mae: 0.002  # Relaxed secondary
        r2_vs_current_multiplier: 1.0  # Lower multiplier
        mae_vs_current_multiplier: 1.0  # Lower multiplier
      classification:
        acc: 0.002  # Relaxed secondary
        f1: 0.002  # Relaxed secondary
        acc_vs_current_multiplier: 1.0  # Lower multiplier
        f1_vs_current_multiplier: 1.0  # Lower multiplier

  # Loss degradation thresholds
  loss_degradation:
    vs_current: 0.02  # Allow slightly more degradation (0.02) for exploration
    vs_best: 0.10  # Allow more degradation vs best (0.10) to escape local optima
    tiny_degradation: 0.02  # Allow tiny degradation
  
  # Metric degradation thresholds (for rejection)
  metric_degradation:
    regression:
      max_r2_degradation: 0.02  # Reject if R2 drops by more than 0.02 vs best
      max_mae_degradation: 0.05  # Reject if MAE increases by more than 0.05 vs best
    classification:
      max_acc_degradation: 0.05  # Reject if accuracy drops by more than 5% vs best
      max_f1_degradation: 0.05  # Reject if F1 drops by more than 5% vs best
      max_acc_degradation_current: 0.10  # Allow more degradation vs current (10%) for exploration
      max_f1_degradation_current: 0.10  # Allow more degradation vs current (10%) for exploration
  
  # Adaptive threshold configuration
  adaptive_threshold:
    base_regression: 0.005  # Base threshold for regression (loss improvement)
    base_classification: 0.005  # Base threshold for classification (from IMPROVEMENT_THRESHOLD_CLASSIFICATION)
    iteration_decay: 0.1  # Multiplier for threshold decay per iteration (1.0 - 0.1 * i)
    max_degradation_early: 0.01  # Maximum allowed degradation in early iterations (first 3)
    early_iteration_limit: 3  # Number of early iterations with relaxed thresholds
  
  # Best snapshot update thresholds
  best_snapshot:
    # Thresholds for updating best_snapshot when metrics improve
    regression:
      r2_improvement: 0.01  # Update best snapshot if R2 improves by at least 0.01
      mae_improvement: 0.01  # Update best snapshot if MAE improves by at least 0.01
    classification:
      acc_improvement: 0.01  # Update best snapshot if accuracy improves by at least 1%
      f1_improvement: 0.01  # Update best snapshot if F1 improves by at least 1%
      acc_improvement_with_loss: 0.01  # Update if acc improves and loss within 0.01 of best
  
  # Restoration configuration
  restoration:
    max_allowed_degradation_regression: 0.2  # Max loss degradation to keep LLM mechanisms (regression)
    max_allowed_degradation_classification: 0.05  # Max loss degradation to keep LLM mechanisms (classification)
  
  # Performance score configuration
  performance_scores:
    min_performance: 0.01  # Minimum performance score (for LLM mechanisms)
    min_performance_ml_dominant: 0.05  # Minimum performance when ML is clearly better
    min_performance_similar: 0.1  # Minimum performance when mechanisms are similar
    max_performance: 1.0  # Maximum performance score
    mae_epsilon: 0.01  # Epsilon for MAE-based performance calculation (1/(epsilon + MAE))
  
  # Confidence defaults
  confidence:
    default: 0.1  # Default confidence when LLM fails to provide confidence
    min: 0.1  # Minimum confidence value
    max: 10.0  # Maximum confidence value
  
  # Scaling verification tolerance
  scaling:
    tolerance: 0.01  # Tolerance for checking if values are within scale range

